name: Kiri libkrun2 isolated RAM lab (Guest + runner)

on:
  workflow_dispatch:
  push:
    branches: [memory-reclaim, memory-reporting-lab]
    paths:
      - "scripts/moby/libkrun2-ram-lab.c"
      - "scripts/moby/libkrun2-memory-probe.c"
      - "scripts/moby/libkrun2-entitlements.plist"
      - "scripts/moby/libkrun-lab-init"
      - "scripts/moby/build-libkrun-lab-guest.sh"
      - "scripts/moby/measure-libkrun-lab-macos.sh"
      - "guest/kernel/**"
      - ".github/workflows/moby-libkrun-lab.yml"
  pull_request:
    paths:
      - "scripts/moby/libkrun2-ram-lab.c"
      - "scripts/moby/libkrun2-memory-probe.c"
      - "scripts/moby/libkrun2-entitlements.plist"
      - "scripts/moby/libkrun-lab-init"
      - "scripts/moby/build-libkrun-lab-guest.sh"
      - "scripts/moby/measure-libkrun-lab-macos.sh"
      - "guest/kernel/**"
      - ".github/workflows/moby-libkrun-lab.yml"

permissions:
  contents: read

jobs:
  guest:
    name: Linux ARM64 MMIO kernel + RAM-only Guest (no Kiri data disk)
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Install initramfs packaging tool
        run: sudo apt-get update -qq && sudo apt-get install -y --no-install-recommends cpio
      - name: Syntax-check experimental scripts
        run: |
          bash -n scripts/moby/build-libkrun-lab-guest.sh
          bash -n scripts/moby/measure-libkrun-lab-macos.sh
          sh -n scripts/moby/libkrun-lab-init
      - name: Build isolated virtio-mmio kernel and RAM-only initramfs
        run: |
          mkdir -p "$RUNNER_TEMP/kiri-libkrun-guest"
          bash scripts/moby/build-libkrun-lab-guest.sh "$RUNNER_TEMP/kiri-libkrun-guest"
          (cd "$RUNNER_TEMP/kiri-libkrun-guest" && sha256sum -c SHA256SUMS)
          (cd "$RUNNER_TEMP/kiri-libkrun-guest" && grep -Fxq 'CONFIG_VIRTIO_MMIO=y' kernel.config)
          (cd "$RUNNER_TEMP/kiri-libkrun-guest" && grep -Fxq 'CONFIG_PAGE_REPORTING=y' kernel.config)
      - name: Publish isolated Guest assets (no Docker VM disk)
        uses: actions/upload-artifact@v4
        with:
          name: experimental-libkrun2-guest-mmio-arm64
          path: ${{ runner.temp }}/kiri-libkrun-guest/
          if-no-files-found: error
          retention-days: 14

  compile:
    name: Apple Silicon experimental VMM runner (no VM boot)
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: Build and sign isolated macOS ARM64 libkrun laboratory
        run: |
          set -euo pipefail
          mkdir -p target/libkrun-lab
          clang -std=c11 -Wall -Wextra -Werror -arch arm64 \
            -o target/libkrun-lab/kiri-libkrun2-ram-lab \
            scripts/moby/libkrun2-ram-lab.c
          clang -std=c11 -Wall -Wextra -Werror -arch arm64 \
            -o target/libkrun-lab/kiri-libkrun2-symbol-probe \
            scripts/moby/libkrun2-memory-probe.c
          for exe in target/libkrun-lab/kiri-*; do
            test "$(lipo "$exe" -archs)" = "arm64"
            codesign --force --sign - \
              --entitlements scripts/moby/libkrun2-entitlements.plist "$exe"
            codesign --verify --strict --verbose=2 "$exe"
          done
          cp docs/MOBY_LIBKRUN_MEMORY.md target/libkrun-lab/README.md
          cp scripts/moby/measure-libkrun-lab-macos.sh target/libkrun-lab/measure-libkrun-lab-macos.sh
          chmod +x target/libkrun-lab/measure-libkrun-lab-macos.sh
          tar -C target/libkrun-lab -czf target/kiri-libkrun2-memory-lab-arm64.tgz .
          (cd target && shasum -a 256 kiri-libkrun2-memory-lab-arm64.tgz \
            > kiri-libkrun2-memory-lab-arm64.tgz.sha256)
      - uses: actions/upload-artifact@v4
        with:
          name: experimental-libkrun2-ram-lab-arm64
          path: |
            target/kiri-libkrun2-memory-lab-arm64.tgz
            target/kiri-libkrun2-memory-lab-arm64.tgz.sha256
          if-no-files-found: error
          retention-days: 14
