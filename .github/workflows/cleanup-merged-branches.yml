name: One-time cleanup of merged Kiri experiment branches

on:
  push:
    branches: [moby-engine]
    paths:
      - ".github/workflows/cleanup-merged-branches.yml"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete only explicitly allowlisted, fully merged branches
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$REPO" == "w101723/kiri" ]] || exit 2
          [[ "${GITHUB_REF_NAME}" == "moby-engine" ]] || exit 2
          # Never delete main, moby-engine, any open PR head or unmerged work.
          git fetch --prune origin '+refs/heads/*:refs/remotes/origin/*'
          base="$(git rev-parse refs/remotes/origin/moby-engine)"
          for branch in \
            adaptive-memory-lab \
            fix-personal-codesign-chain \
            memory-200m-lab \
            memory-reclaim \
            memory-reporting-lab \
            stable-personal-signing-finalize; do
            ref="refs/remotes/origin/$branch"
            if ! git show-ref --verify --quiet "$ref"; then
              echo "Already gone: $branch"
              continue
            fi
            old="$(git rev-parse "$ref")"
            if ! git merge-base --is-ancestor "$old" "$base"; then
              echo "PRESERVED (not fully merged): $branch at $old"
              continue
            fi
            open="$(gh api "repos/$REPO/pulls?state=open&head=w101723:$branch&per_page=10" --jq 'length')"
            if [[ "$open" != 0 ]]; then
              echo "PRESERVED (open PR): $branch"
              continue
            fi
            current="$(gh api "repos/$REPO/git/ref/heads/$branch" --jq '.object.sha')"
            if [[ "$current" != "$old" ]]; then
              echo "PRESERVED (head moved): $branch $old -> $current"
              continue
            fi
            gh api -X DELETE "repos/$REPO/git/refs/heads/$branch"
            echo "DELETED merged, unreferenced branch: $branch"
          done
          printf '%s\n' "Protected branches main and moby-engine were not touched."
