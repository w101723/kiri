name: Refresh Guest-only Cargo lockfile
on:
  workflow_dispatch:
  push:
    branches: [apple-silicon-native-parity]
    paths:
      - ".github/workflows/guest-cargo-lockfile.yml"
      - "Cargo.toml"
      - "crates/kiri-moby-bridge/Cargo.toml"
permissions:
  contents: write
jobs:
  generate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo generate-lockfile
      - name: Update dependencies after removing Rust Host
        run: |
          set -euo pipefail
          if git diff --quiet -- Cargo.lock; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Cargo.lock
          git commit -m "build(guest): keep only Linux Rust transport dependencies"
          git push origin "HEAD:${GITHUB_REF_NAME}"
