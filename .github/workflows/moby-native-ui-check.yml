name: Native SwiftUI Moby GUI compile and bridge check

on:
  push:
    branches: [native-swiftui-moby, apple-silicon-native-parity]
    paths:
      - "crates/kiri/native/**"
      - "crates/kiri/src/moby.rs"
      - "crates/kiri/src/client.rs"
      - "crates/kiri/src/main.rs"
      - "scripts/moby/check-native-ui-parity.py"
      - "Cargo.toml"
      - "crates/kiri/Cargo.toml"
      - "crates/kiri-vmm/Cargo.toml"
      - "xtask/src/main.rs"
      - ".github/workflows/moby-native-ui-check.yml"
  pull_request:
    paths:
      - "crates/kiri/native/**"
      - "crates/kiri/src/moby.rs"
      - "crates/kiri/src/client.rs"
      - "crates/kiri/src/main.rs"
      - "scripts/moby/check-native-ui-parity.py"
      - "Cargo.toml"
      - "crates/kiri/Cargo.toml"
      - "crates/kiri-vmm/Cargo.toml"
      - "xtask/src/main.rs"
      - ".github/workflows/moby-native-ui-check.yml"
  workflow_dispatch:

permissions:
  contents: read

# Avoid a backlog of expensive SwiftTerm builds for superseded UI commits.
concurrency:
  group: native-moby-gui-${{ github.ref }}
  cancel-in-progress: true

jobs:
  swiftui:
    runs-on: macos-15-intel
    timeout-minutes: 20
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: Compare native controls and layout with the original Moby UI
        run: python3 scripts/moby/check-native-ui-parity.py
      - name: Cross-compile actual native SwiftUI app for Apple Silicon
        run: |
          set -euo pipefail
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          swiftc -parse-as-library -O \
            -target arm64-apple-macosx14.0 -sdk "$sdk" \
            crates/kiri/native/MobyApp.swift \
            crates/kiri/native/MobyRuntime.swift \
            -o "$RUNNER_TEMP/kiri-moby-native-ui"
          test "$(lipo "$RUNNER_TEMP/kiri-moby-native-ui" -archs)" = arm64
          if otool -L "$RUNNER_TEMP/kiri-moby-native-ui" | grep -E 'WebKit|JavaScriptCore'; then
            echo "Native GUI unexpectedly depends on WebKit/JavaScriptCore" >&2
            exit 1
          fi
          codesign --force --sign - "$RUNNER_TEMP/kiri-moby-native-ui"
          codesign --verify --strict "$RUNNER_TEMP/kiri-moby-native-ui"
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin
      - name: Compile existing Rust backend with native command bridge
        run: cargo check -p kiri --target aarch64-apple-darwin
      - name: Verify Apple Silicon-only build helper
        run: cargo check -p xtask --target aarch64-apple-darwin

  swiftterm:
    name: Verify SwiftTerm-backed production terminal on Apple Silicon
    runs-on: macos-15-intel
    timeout-minutes: 25
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: Resolve pinned SwiftTerm and cross-compile production AppKit executable
        shell: bash
        run: |
          set -euo pipefail
          swift build --package-path crates/kiri/native -c release \
            --triple arm64-apple-macosx14.0 --product kiri-moby-ui
          find crates/kiri/native/.build -type f -name kiri-moby-ui -print
          file="$(find crates/kiri/native/.build -type f -name kiri-moby-ui | head -n1)"
          test -n "$file"
          test "$(lipo "$file" -archs)" = arm64
          if otool -L "$file" | grep -E 'WebKit|JavaScriptCore'; then
            echo "SwiftTerm build unexpectedly links WebKit" >&2
            exit 1
          fi
          codesign --force --sign - "$file"
          codesign --verify --strict "$file"
