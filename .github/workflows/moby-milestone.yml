name: Kiri Moby unified macOS ARM64 milestone bundle

on:
  workflow_dispatch:
  # Build a same-commit Host+Guest+GUI bundle. A Gatekeeper-trusted release
  # requires Developer ID signing + notarization; otherwise use DEV-ADHOC
  # artifact names and do not imply regular macOS Gatekeeper acceptance.
  # The isolated memory lab must build its own matching Guest and Host;
  # reusing a moby-engine Guest would silently omit its experimental flag.
  push:
    # Release branch only. Feature-branch commits run the fast native GUI
    # and bridge checks. A full signed feature bundle can still be started
    # deliberately via workflow_dispatch to avoid repeated kernel builds.
    branches: [moby-engine]
    paths:
      - ".github/workflows/moby-milestone.yml"
      - "scripts/moby/sign-notarize-macos.sh"
      - "scripts/moby/sign-personal-macos.sh"
      - "scripts/moby/install-local-macos.sh"
      - "scripts/moby/package-dmg-macos.sh"
      - "scripts/moby/build-guest.sh"
      - "scripts/moby/guest/**"
      - "scripts/moby/measure-memory-macos.sh"
      - "crates/kiri-moby-bridge/**"
      - "crates/kiri/native/**"
      - "guest/kernel/**"
      - "Cargo.lock"
      - "Cargo.toml"
      - "scripts/moby/check-native-ui-parity.py"
      - "brand/icon/png/**"

concurrency:
  group: moby-milestone-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  signing-preflight:
    name: Verify stable signing identity before expensive full build
    runs-on: macos-15-intel
    timeout-minutes: 10
    env:
      KIRI_PERSONAL_SIGN_P12_BASE64: ${{ secrets.KIRI_PERSONAL_SIGN_P12_BASE64 }}
      KIRI_PERSONAL_SIGN_P12_PASSWORD: ${{ secrets.KIRI_PERSONAL_SIGN_P12_PASSWORD }}
      KIRI_PERSONAL_SIGN_CERT_SHA256: ${{ secrets.KIRI_PERSONAL_SIGN_CERT_SHA256 }}
      KIRI_PERSONAL_SIGN_CA_PEM_BASE64: ${{ secrets.KIRI_PERSONAL_SIGN_CA_PEM_BASE64 }}
      KIRI_REQUIRE_PERSONAL_SIGNING: ${{ vars.KIRI_REQUIRE_PERSONAL_SIGNING || 'true' }}
    steps:
      - uses: actions/checkout@v4
      - name: Guard original Moby UI feature parity on Apple Silicon
        run: python3 scripts/moby/check-native-ui-parity.py
      - name: Verify real private certificate and full CA chain
        shell: bash
        run: |
          set -euo pipefail
          app="packaged/Kiri Moby.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources/bin/cli-plugins"
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <plist version="1.0"><dict>
          <key>CFBundleIdentifier</key><string>dev.kiri.app.moby</string>
          <key>CFBundleExecutable</key><string>kiri-moby-ui</string>
          <key>CFBundlePackageType</key><string>APPL</string>
          <key>CFBundleVersion</key><string>1</string>
          </dict></plist>
          PLIST
          printf 'int main(void){return 0;}\n' > "$RUNNER_TEMP/kiri-signing-probe.c"
          clang -arch x86_64 -o "$app/Contents/MacOS/kiri-moby-ui" "$RUNNER_TEMP/kiri-signing-probe.c"
          for bin in kiri-moby-host docker cli-plugins/docker-compose cli-plugins/docker-buildx; do
            cp "$app/Contents/MacOS/kiri-moby-ui" "$app/Contents/Resources/bin/$bin"
          done
          bash scripts/moby/sign-personal-macos.sh "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          echo "PASS: fixed P12 identity can sign an App before building Linux Guest."
  guest:
    name: Linux ARM64 Guest (Docker Engine and ext4)
    needs: signing-preflight
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-musl
      - name: Guest build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends musl-tools cpio e2fsprogs
      - name: Syntax-check tiny boot stage and ext4 userspace init
        run: |
          sh -n scripts/moby/guest/stage1-init
          sh -n scripts/moby/guest/init
          # Data and the read-only seed must be selected by LABEL, never by
          # potentially reordered virtio device letters.
          grep -Fq 'kiri-moby' scripts/moby/guest/stage1-init
          grep -Fq 'kiri-system' scripts/moby/guest/stage1-init
          if grep -Fq 'blkid -s LABEL' scripts/moby/guest/stage1-init; then
            echo "The tiny BusyBox blkid lacks util-linux flag compatibility" >&2
            exit 1
          fi
      - name: Compile Guest agent
        run: cargo build --release --target aarch64-unknown-linux-musl -p kiri-moby-bridge --bin kiri-moby-guest
      - name: Build standard Docker Guest and data disk template
        run: ./scripts/moby/build-guest.sh
      - name: Validate tiny early-boot archive and sealed rootfs checksums
        run: |
          set -euo pipefail
          cd target/moby-guest
          sha256sum -c SHA256SUMS
          test -s rootfs.revision
          test "$(stat -c '%s' initramfs.cpio)" -lt 16777216
          cpio -it --quiet < initramfs.cpio > /tmp/kiri-boot-contents
          grep -Fxq init /tmp/kiri-boot-contents
          grep -Fxq bin/busybox /tmp/kiri-boot-contents
          if grep -Eq 'dockerd|containerd|runc' /tmp/kiri-boot-contents; then
            echo "The Docker Engine unexpectedly resides in initramfs" >&2
            exit 1
          fi
          echo "Tiny ARM64 boot image verified" >> "$GITHUB_STEP_SUMMARY"
      - name: Reuse exact-kernel verified ARM64 artifact if sources match
        id: reuse_kernel
        if: github.ref_name == 'moby-engine' || github.ref_name == 'apple-silicon-native-parity'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          # Use only a kernel from the previously successful milestone, and
          # only when the guest kernel source/config/build scripts match.
          prior="6df7033fa9b5e3e21d8e423c4bafd9c18c30d36c"
          if ! git cat-file -e "$prior^{commit}" 2>/dev/null ||
             ! git diff --quiet "$prior" HEAD -- guest/kernel; then
            echo 'reused=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! command -v gh >/dev/null 2>&1; then
            echo 'reused=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          mkdir -p /tmp/kiri-kernel-previous
          if ! gh run download 44708932735 --repo w101723/kiri \
              --name milestone-guest-arm64 --dir /tmp/kiri-kernel-previous; then
            echo 'reused=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          tar -xzf /tmp/kiri-kernel-previous/kiri-moby-guest-arm64.tgz \
            -C /tmp/kiri-kernel-previous
          (
            cd /tmp/kiri-kernel-previous
            sha256sum -c SHA256SUMS
          )
          mkdir -p guest/out
          cp /tmp/kiri-kernel-previous/Image guest/out/Image
          echo 'reused=true' >> "$GITHUB_OUTPUT"
      - name: Build Linux ARM64 kernel if a verified reuse is not possible
        if: steps.reuse_kernel.outputs.reused != 'true'
        run: |
          set -euo pipefail
          mkdir -p guest/out target/kernel-build
          docker run --rm --platform linux/arm64 \
            -v "$PWD/guest/kernel:/src:ro" \
            -v "$PWD/guest/out:/out" \
            -v "$PWD/target/kernel-build:/build" \
            ubuntu:24.04 sh /src/build.sh
          test -s guest/out/Image
          echo "Linux ARM64 Guest kernel built directly without legacy xtask."
      - name: Bundle Guest with file checksums
        run: |
          cp guest/out/Image target/moby-guest/Image
          (cd target/moby-guest && sha256sum Image >> SHA256SUMS)
          tar -C target/moby-guest -czf kiri-moby-guest-arm64.tgz Image initramfs.cpio data.img.tgz system.img.tgz rootfs.revision SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: milestone-guest-arm64
          path: kiri-moby-guest-arm64.tgz
          compression-level: 0
          retention-days: 14

  host:
    name: Apple Silicon Host (Intel macOS cross-link and sign)
    needs: signing-preflight
    runs-on: macos-15-intel
    env:
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@v4
      - name: Build Swift Virtualization.framework Host (Apple Silicon ARM64)
        run: |
          set -euo pipefail
          mkdir -p target/arm64-swift
          sdk="$(xcrun --sdk macosx --show-sdk-path)"
          swiftc -parse-as-library -O -target arm64-apple-macosx14.0 -sdk "$sdk" \
            crates/kiri/native/KiriMobyHost.swift -o target/arm64-swift/kiri-moby-host
          binary="target/arm64-swift/kiri-moby-host"
          test "$(lipo "$binary" -archs)" = arm64
          codesign --force --sign - --entitlements crates/kiri/kiri.entitlements "$binary"
          codesign --verify --strict --verbose=2 "$binary"
          tar -C target/arm64-swift -czf kiri-moby-host-arm64.tgz kiri-moby-host
      - uses: actions/upload-artifact@v4
        with:
          name: milestone-host-arm64
          path: kiri-moby-host-arm64.tgz
          retention-days: 14
      - name: Build native Apple Silicon Kiri Moby GUI
        run: |
          set -euo pipefail
          # The release executable MUST link SwiftTerm. The previous
          # swiftc-only fallback has no VT100/xterm cursor renderer.
          swift build --package-path crates/kiri/native -c release \
            --triple arm64-apple-macosx14.0 --product kiri-moby-ui
          swift_dir="$(swift build --package-path crates/kiri/native -c release \
            --triple arm64-apple-macosx14.0 --show-bin-path)"
          target_dir="target/aarch64-apple-darwin/release"
          native="$target_dir/kiri-moby-ui"
          cp "$swift_dir/kiri-moby-ui" "$native"
          test "$(lipo "$native" -archs)" = "arm64"
          if otool -L "$native" | grep -E 'WebKit|JavaScriptCore'; then
            echo "Native SwiftUI GUI unexpectedly links WebKit or JavaScriptCore" >&2
            exit 1
          fi
          codesign --force --sign - "$native"
          codesign --verify --strict --verbose=2 "$native"
          # SwiftTerm uses SwiftPM Metal resources. Carry every bundled
          # resource through the host/guest GUI artifact into the .app.
          files=(kiri-moby-ui)
          for bundle in "$swift_dir"/*.bundle; do
            test -d "$bundle" || continue
            cp -R "$bundle" "$target_dir/"
            files+=("$(basename "$bundle")")
          done
          tar -C "$target_dir" -czf kiri-moby-gui-arm64.tgz "${files[@]}"
      - uses: actions/upload-artifact@v4
        with:
          name: milestone-gui-arm64
          path: kiri-moby-gui-arm64.tgz
          retention-days: 14

  bundle:
    name: Unified Kiri Moby.app for Apple Silicon
    needs: [guest, host]
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: milestone-guest-arm64
          path: downloaded/guest
      - uses: actions/download-artifact@v4
        with:
          name: milestone-host-arm64
          path: downloaded/host
      - uses: actions/download-artifact@v4
        with:
          name: milestone-gui-arm64
          path: downloaded/gui
      - name: Assemble same-commit verified Host+Guest bundle
        run: |
          set -euo pipefail
          mkdir -p assembled/guest assembled/bin
          tar -xzf downloaded/guest/kiri-moby-guest-arm64.tgz -C assembled/guest Image initramfs.cpio data.img.tgz system.img.tgz rootfs.revision SHA256SUMS
          tar -xzf downloaded/host/kiri-moby-host-arm64.tgz -C assembled/bin kiri-moby-host
          (cd assembled/guest && shasum -a 256 -c SHA256SUMS)
          printf '%s\n' "${{ github.sha }}" > assembled/SOURCE_REVISION
          (cd assembled && shasum -a 256 guest/Image guest/initramfs.cpio guest/data.img.tgz guest/system.img.tgz guest/rootfs.revision guest/SHA256SUMS bin/kiri-moby-host SOURCE_REVISION > BUNDLE_SHA256SUMS)
          tar -C assembled -czf kiri-moby-macos-arm64-bundle.tgz guest bin SOURCE_REVISION BUNDLE_SHA256SUMS
      - name: Fetch pinned official Docker CLI, Compose and Buildx
        run: |
          set -euo pipefail
          mkdir -p downloaded/cli
          curl -fL --retry 3 --retry-delay 2 -o downloaded/cli/docker.tgz \
            https://download.docker.com/mac/static/stable/aarch64/docker-29.9.2.tgz
          curl -fL --retry 3 --retry-delay 2 -o downloaded/cli/docker-compose \
            https://github.com/docker/compose/releases/download/v5.6.1/docker-compose-darwin-aarch64
          curl -fL --retry 3 --retry-delay 2 -o downloaded/cli/docker-buildx \
            https://github.com/docker/buildx/releases/download/v0.38.1/buildx-v0.38.1.darwin-arm64
          echo 'ea8a2ce5ac31f9f5f3fb711a7a485e1e46cc7a69798a629a70306f6e6af25b7a  downloaded/cli/docker.tgz' | shasum -a 256 -c -
          echo 'fcce41226abd2b7b2936094e688bbd61284673dddafea542e08cb9a3b4423a8b  downloaded/cli/docker-compose' | shasum -a 256 -c -
          echo '6f20ba2437865311ef99015bf5d1039c3c8e4d2177c1c64aa41b134b5ecd3012  downloaded/cli/docker-buildx' | shasum -a 256 -c -
      - name: Build and sign single native Kiri Moby.app
        run: |
          set -euo pipefail
          app="packaged/Kiri Moby.app"
          mac="$app/Contents/MacOS"
          res="$app/Contents/Resources"
          mkdir -p "$mac" "$res/guest" "$res/bin/cli-plugins"
          tar -xzf downloaded/gui/kiri-moby-gui-arm64.tgz -C "$mac"
          for bundle in "$mac"/*.bundle; do
            test -d "$bundle" || continue
            mv "$bundle" "$res/"
          done
          chmod 755 "$mac/kiri-moby-ui"
          cp assembled/guest/Image assembled/guest/initramfs.cpio \
             assembled/guest/data.img.tgz assembled/guest/system.img.tgz \
             assembled/guest/rootfs.revision assembled/guest/SHA256SUMS "$res/guest/"
          cp assembled/bin/kiri-moby-host "$res/bin/kiri-moby-host"
          cp assembled/SOURCE_REVISION "$res/SOURCE_REVISION"
          tar -xzf downloaded/cli/docker.tgz -C downloaded/cli docker/docker
          cp downloaded/cli/docker/docker "$res/bin/docker"
          cp downloaded/cli/docker-compose "$res/bin/cli-plugins/docker-compose"
          cp downloaded/cli/docker-buildx "$res/bin/cli-plugins/docker-buildx"
          chmod 755 "$res/bin/kiri-moby-host" "$res/bin/docker" \
            "$res/bin/cli-plugins/docker-compose" "$res/bin/cli-plugins/docker-buildx"
          cp LICENSE "$res/"
          cp NOTICE-NATIVE.txt "$res/NOTICE"
          mkdir -p packaged/Kiri.iconset
          for spec in '16 1' '16 2' '32 1' '32 2' '128 1' '128 2' '256 1' '256 2' '512 1' '512 2'; do
            set -- $spec
            size="$1"
            scale="$2"
            pixels="$((size * scale))"
            if [ "$scale" = 1 ]; then
              name="icon_${size}x${size}.png"
            else
              name="icon_${size}x${size}@2x.png"
            fi
            cp "brand/icon/png/kiri-app-icon-${pixels}.png" "packaged/Kiri.iconset/$name"
          done
          iconutil -c icns -o "$res/Kiri.icns" packaged/Kiri.iconset
          cat > "$app/Contents/Info.plist" <<'PLIST'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Kiri Moby</string>
            <key>CFBundleDisplayName</key><string>Kiri Moby</string>
            <key>CFBundleIdentifier</key><string>dev.kiri.app.moby</string>
            <key>CFBundleExecutable</key><string>kiri-moby-ui</string>
            <key>CFBundleIconFile</key><string>Kiri</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>0.1.0</string>
            <key>CFBundleVersion</key><string>1</string>
            <key>LSMinimumSystemVersion</key><string>14.0</string>
            <key>NSHighResolutionCapable</key><true/>
            <key>LSApplicationCategoryType</key><string>public.app-category.developer-tools</string>
          </dict>
          </plist>
          PLIST
          plutil -lint "$app/Contents/Info.plist"
          python3 scripts/moby/audit-native-runtime.py --app "$app"
          test "$(lipo "$res/bin/kiri-moby-host" -archs)" = "arm64"
          codesign --force --sign - --entitlements crates/kiri/kiri.entitlements "$res/bin/kiri-moby-host"
          for binary in "$res/bin/docker" \
            "$res/bin/cli-plugins/docker-compose" "$res/bin/cli-plugins/docker-buildx"; do
            test "$(lipo "$binary" -archs)" = "arm64"
            codesign --force --sign - "$binary"
          done
          test "$(lipo "$mac/kiri-moby-ui" -archs)" = "arm64"
          codesign --force --sign - "$mac/kiri-moby-ui"
          codesign --force --sign - --entitlements crates/kiri/kiri.entitlements "$app"
          codesign --verify --deep --strict --verbose=2 "$app"
          tar -czf Kiri-Moby-macos-arm64-app.tgz -C packaged "Kiri Moby.app"
          shasum -a 256 Kiri-Moby-macos-arm64-app.tgz > Kiri-Moby-macos-arm64-app.tgz.sha256
          ls -lh Kiri-Moby-macos-arm64-app.tgz
      - name: Apply persistent personal signature if configured
        id: personal
        env:
          KIRI_PERSONAL_SIGN_P12_BASE64: ${{ secrets.KIRI_PERSONAL_SIGN_P12_BASE64 }}
          KIRI_PERSONAL_SIGN_P12_PASSWORD: ${{ secrets.KIRI_PERSONAL_SIGN_P12_PASSWORD }}
          KIRI_PERSONAL_SIGN_CERT_SHA256: ${{ secrets.KIRI_PERSONAL_SIGN_CERT_SHA256 }}
          # Public root CA certificate for a private, CA-issued signer.
          KIRI_PERSONAL_SIGN_CA_PEM_BASE64: ${{ secrets.KIRI_PERSONAL_SIGN_CA_PEM_BASE64 }}
          # This is a private personal build: never silently fall back to
          # per-build ad-hoc signing. Can be overridden explicitly with the
          # repository variable KIRI_REQUIRE_PERSONAL_SIGNING=false.
          KIRI_REQUIRE_PERSONAL_SIGNING: ${{ vars.KIRI_REQUIRE_PERSONAL_SIGNING || 'true' }}
        run: bash scripts/moby/sign-personal-macos.sh "packaged/Kiri Moby.app"
      - name: Create clearly labeled private development DMG
        id: dev_package
        env:
          PERSONAL_SIGNED: ${{ steps.personal.outputs.signed }}
        run: |
          set -euo pipefail
          if [[ "$PERSONAL_SIGNED" == "true" ]]; then
            label="DEV-PERSONAL-CERT"
          else
            label="DEV-ADHOC"
          fi
          echo "label=$label" >> "$GITHUB_OUTPUT"
          echo "filename=Kiri-Moby-macos-arm64-$label.dmg" >> "$GITHUB_OUTPUT"
          bash scripts/moby/package-dmg-macos.sh \
            "packaged/Kiri Moby.app" "Kiri-Moby-macos-arm64-$label.dmg"
          ls -lh "Kiri-Moby-macos-arm64-$label.dmg"
      - name: Verify ad-hoc app package and bundle local-only installer
        run: |
          bash -n scripts/moby/install-local-macos.sh
          bash scripts/moby/install-local-macos.sh --verify Kiri-Moby-macos-arm64-app.tgz
          cp scripts/moby/install-local-macos.sh Kiri-Moby-install-local.sh
      - name: Record private signature class
        env:
          PERSONAL_SIGNED: ${{ steps.personal.outputs.signed }}
          CERT_SHA256: ${{ steps.personal.outputs.cert_sha256 }}
        run: |
          if [[ "$PERSONAL_SIGNED" == "true" ]]; then
            printf 'Persistent personal certificate SHA256: %s\nNot Apple-notarized. Use the pinned one-time local installer, not direct quarantined DMG drag-and-drop.\n' "$CERT_SHA256" > SIGNING-STATUS.txt
          else
            printf 'Ad-hoc signing only: no persistent identity and no Apple notarization. Configure KIRI_PERSONAL_SIGN_* secrets for repeatable personal signing.\n' > SIGNING-STATUS.txt
          fi
      - name: Developer ID sign + notarize for normal macOS updates
        id: notarize
        env:
          MACOS_DEVELOPER_ID_P12_BASE64: ${{ secrets.MACOS_DEVELOPER_ID_P12_BASE64 }}
          MACOS_DEVELOPER_ID_P12_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_P12_PASSWORD }}
          MACOS_DEVELOPER_ID_IDENTITY: ${{ secrets.MACOS_DEVELOPER_ID_IDENTITY }}
          APPLE_NOTARY_KEY_BASE64: ${{ secrets.APPLE_NOTARY_KEY_BASE64 }}
          APPLE_NOTARY_KEY_ID: ${{ secrets.APPLE_NOTARY_KEY_ID }}
          APPLE_NOTARY_ISSUER_ID: ${{ secrets.APPLE_NOTARY_ISSUER_ID }}
        run: bash scripts/moby/sign-notarize-macos.sh "packaged/Kiri Moby.app"
      - name: Verify distribution signature status
        env:
          NOTARIZED: ${{ steps.notarize.outputs.notarized }}
        run: |
          set -euo pipefail
          codesign --verify --deep --strict --verbose=2 "packaged/Kiri Moby.app"
          if [[ "$NOTARIZED" == true ]]; then
            test -s Kiri-Moby-macos-arm64-notarized.dmg
            xcrun stapler validate Kiri-Moby-macos-arm64-notarized.dmg
            echo "TRUSTED: Developer ID and Apple notarization verified" >> "$GITHUB_STEP_SUMMARY"
          else
            test -s "${{ steps.dev_package.outputs.filename }}"
            echo "PRIVATE BUILD: ${{ steps.dev_package.outputs.label }}; Apple Gatekeeper notarization not available" >> "$GITHUB_STEP_SUMMARY"
          fi
      - uses: actions/upload-artifact@v4
        if: steps.notarize.outputs.notarized != 'true'
        with:
          name: Kiri-Moby-macos-arm64-${{ steps.dev_package.outputs.label }}-DMG
          path: |
            ${{ steps.dev_package.outputs.filename }}
            ${{ steps.dev_package.outputs.filename }}.sha256
            SIGNING-STATUS.txt
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        if: steps.notarize.outputs.notarized == 'true'
        with:
          name: Kiri-Moby-macos-arm64-DeveloperID-notarized
          path: |
            Kiri-Moby-macos-arm64-notarized.dmg
            Kiri-Moby-macos-arm64-notarized.dmg.sha256
          if-no-files-found: error
          compression-level: 0
          retention-days: 30
      - uses: actions/upload-artifact@v4
        with:
          name: Kiri-Moby-macos-arm64-${{ steps.dev_package.outputs.label }}-app
          path: |
            Kiri-Moby-macos-arm64-app.tgz
            Kiri-Moby-macos-arm64-app.tgz.sha256
            SIGNING-STATUS.txt
            Kiri-Moby-install-local.sh
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: kiri-moby-macos-arm64-bundle
          path: kiri-moby-macos-arm64-bundle.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 14
