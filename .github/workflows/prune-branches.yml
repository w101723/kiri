name: Keep only main and moby-engine

on:
  push:
    branches: [moby-engine]
    paths: ['.github/workflows/prune-branches.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  prune:
    if: github.repository == 'w101723/kiri' && github.ref == 'refs/heads/moby-engine'
    runs-on: ubuntu-24.04
    steps:
      - name: Delete all remote branches except main and moby-engine
        uses: actions/github-script@v7
        with:
          script: |
            const owner = 'w101723';
            const repo = 'kiri';
            const keep = new Set(['main', 'moby-engine']);
            const { data: repository } = await github.rest.repos.get({ owner, repo });
            if (repository.default_branch !== 'main') {
              core.setFailed('Default branch changed; refusing to delete branches');
              return;
            }
            const branches = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            const others = branches.filter(b => !keep.has(b.name));
            core.notice(`Keeping main and moby-engine; deleting ${others.length} other remote branches`);
            const failures = [];
            for (const branch of others) {
              if (branch.protected) {
                failures.push(`${branch.name}: protected`);
                continue;
              }
              try {
                await github.rest.git.deleteRef({
                  owner, repo, ref: `heads/${branch.name}`
                });
                core.info(`Deleted ${branch.name}`);
              } catch (error) {
                failures.push(`${branch.name}: ${error.message}`);
              }
            }
            const remaining = await github.paginate(github.rest.repos.listBranches, {
              owner, repo, per_page: 100
            });
            core.notice(`Remaining: ${remaining.map(b => b.name).join(', ')}`);
            if (failures.length || remaining.some(b => !keep.has(b.name))) {
              core.setFailed(failures.join('\n') || 'Other branches remain');
            }
