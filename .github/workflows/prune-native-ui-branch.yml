name: One-time prune merged native UI feature branch

on:
  push:
    branches: [moby-engine]
    paths:
      - ".github/workflows/prune-native-ui-branch.yml"

permissions:
  contents: write
  pull-requests: read

jobs:
  prune:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Check feature branch ancestry and remove obsolete ref
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          repo="w101723/kiri"
          old="native-swiftui-moby"
          test "$GITHUB_REPOSITORY" = "$repo"
          test "$GITHUB_REF_NAME" = "moby-engine"
          git fetch origin --prune '+refs/heads/*:refs/remotes/origin/*'
          if ! git show-ref --verify --quiet "refs/remotes/origin/$old"; then
            echo "Feature branch already deleted."
            exit 0
          fi
          old_sha="$(git rev-parse "refs/remotes/origin/$old")"
          new_sha="$(git rev-parse refs/remotes/origin/moby-engine)"
          if ! git merge-base --is-ancestor "$old_sha" "$new_sha"; then
            echo "Not merged; branch preserved."
            exit 1
          fi
          open="$(gh api "repos/$repo/pulls?state=open&head=w101723:$old" --jq 'length')"
          test "$open" = 0
          live_sha="$(gh api "repos/$repo/git/ref/heads/$old" --jq .object.sha)"
          if [ "$old_sha" != "$live_sha" ]; then
            echo "Branch moved; preserve for review."
            exit 1
          fi
          gh api -X DELETE "repos/$repo/git/refs/heads/$old"
          echo "Removed fully merged native-swiftui-moby branch. main and moby-engine untouched."
