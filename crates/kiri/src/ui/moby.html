<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Kiri Moby</title>
<style>
:root{--bg:#10151c;--sidebar:#171e26;--panel:#1d2631;--hover:#283644;--line:#334454;--text:#eaf1f8;--muted:#a3b0bf;--accent:#65acff;--green:#62d7ad;--danger:#fc838e;color-scheme:dark;font:13px -apple-system,BlinkMacSystemFont,"SF Pro Text","PingFang SC",sans-serif}
@media(prefers-color-scheme:light){:root{--bg:#f6f8fc;--sidebar:#edf2f8;--panel:#fff;--hover:#e6edf6;--line:#d8e2ed;--text:#192838;--muted:#66788b;--accent:#287cd8;--green:#178361;--danger:#d33a4c;color-scheme:light}}
*{box-sizing:border-box}html,body{height:100%;margin:0;overflow:hidden}body{display:grid;grid-template-columns:206px minmax(0,1fr);background:var(--bg);color:var(--text)}aside{background:var(--sidebar);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:0 12px 16px}.brand{height:68px;display:flex;align-items:center;gap:10px;padding-left:60px;border-bottom:1px solid var(--line)}.logo{width:30px;height:30px;display:grid;place-items:center;border-radius:10px;background:linear-gradient(130deg,#ffd099,#ec926c);color:#302332;font-size:19px;font-weight:900}.brand b{font-size:17px}.brand small{display:block;color:var(--muted);font-size:10px;letter-spacing:.07em}
nav{display:grid;gap:4px;margin-top:17px}nav button{border:0;text-align:left;background:transparent;color:var(--muted);padding:12px;border-radius:8px;cursor:pointer;font-size:13px;display:flex;align-items:center;gap:11px}nav button i{font-size:16px;font-style:normal;width:20px;text-align:center}nav button em{margin-left:auto;font-style:normal;font-variant-numeric:tabular-nums}nav button.active,nav button:hover{background:var(--hover);color:var(--text)}.sidefoot{border-top:1px solid var(--line);margin-top:auto;padding:15px 6px 0;color:var(--muted);font-size:11px;line-height:1.8}.dot{width:8px;height:8px;display:inline-block;border-radius:50%;margin-right:6px;background:#778593}.dot.on{background:var(--green)}
main{display:flex;flex-direction:column;min-width:0;height:100vh}header{height:68px;flex:none;display:flex;align-items:center;gap:10px;padding:0 26px;border-bottom:1px solid var(--line)}header h1{margin:0;font-size:18px}header .subtitle{color:var(--muted);font-size:11px;margin-top:4px}.spacer{flex:1}#content{padding:26px;flex:1;overflow:auto}
button,input{font-family:inherit}button{cursor:pointer}input{color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 11px;font-size:12px;outline:0}input:focus{border-color:var(--accent)}.btn{background:var(--panel);border:1px solid var(--line);border-radius:8px;color:var(--text);padding:8px 13px;white-space:nowrap;font-weight:600;font-size:12px}.btn:hover{background:var(--hover)}.btn.primary{background:var(--accent);border-color:transparent;color:white}.btn.danger{color:var(--danger)}.btn.small{padding:5px 8px;font-size:11px}
.grid{display:grid;grid-template-columns:repeat(4,minmax(110px,1fr));gap:13px;margin-bottom:18px}.metric,.card,.table{background:var(--panel);border:1px solid var(--line);border-radius:12px}.metric{padding:19px}.metric small{color:var(--muted)}.metric strong{display:block;font-size:28px;margin-top:9px}.card{padding:22px;margin-bottom:16px}.card h2{font-size:14px;margin:0 0 14px}.card p{color:var(--muted);line-height:1.7}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:16px}.toolbar h2{font-size:16px;margin:0}.table{overflow:auto}table{border-collapse:collapse;width:100%;font-size:12px}th{text-align:left;color:var(--muted);background:var(--hover);padding:12px 13px;font-size:11px}td{padding:13px;border-top:1px solid var(--line);vertical-align:middle}td .name{font-weight:650;display:block;overflow-wrap:anywhere}td small{color:var(--muted);display:block;margin-top:4px;overflow-wrap:anywhere}.pill{border:1px solid var(--line);border-radius:7px;padding:4px 7px;font-size:11px;color:var(--muted)}.pill.running{color:var(--green)}.buttons{display:flex;flex-wrap:wrap;gap:5px}.empty{text-align:center;padding:54px;color:var(--muted)}.form{display:grid;grid-template-columns:1fr 1fr;gap:18px}.field label{display:block;color:var(--muted);margin-bottom:8px}.field input{width:100%}.full{grid-column:1/-1}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.mono,pre{font:11px "SF Mono",Menlo,monospace}pre{margin:15px;border-radius:8px;padding:15px;white-space:pre-wrap;word-break:break-all;overflow:auto;background:var(--bg);color:var(--text)}
#toast{position:fixed;bottom:23px;right:24px;z-index:20;max-width:520px;padding:14px 18px;border-radius:9px;border:1px solid var(--line);border-left:3px solid var(--green);background:var(--panel);box-shadow:0 12px 24px #0005;display:none;white-space:pre-wrap}#toast.error{border-left-color:var(--danger)}
#overlay{position:fixed;inset:0;z-index:30;background:#0009;display:none;align-items:center;justify-content:center;padding:28px}#modal{width:min(880px,90vw);height:min(690px,85vh);background:var(--panel);border:1px solid var(--line);border-radius:12px;display:flex;flex-direction:column;overflow:hidden}.modalhead{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between}#modal pre{flex:1;overflow:auto}
@media(max-width:920px){body{grid-template-columns:165px minmax(0,1fr)}.brand{padding-left:52px}.grid{grid-template-columns:repeat(2,minmax(100px,1fr))}#search{width:145px}td{padding:10px 7px}}
</style></head><body>
<aside><div class="brand"><span class="logo">K</span><span><b>Kiri</b><small>MOBY ENGINE</small></span></div><nav id="nav">
<button class="active" data-page="dashboard"><i>◈</i>总览</button>
<button data-page="containers"><i>▣</i>容器<em id="count-containers">0</em></button>
<button data-page="images"><i>▤</i>镜像<em id="count-images">0</em></button>
<button data-page="volumes"><i>▱</i>Volume<em id="count-volumes">0</em></button>
<button data-page="networks"><i>◎</i>网络<em id="count-networks">0</em></button>
<button data-page="compose"><i>⬡</i>Compose</button>
<button data-page="build"><i>⚒</i>Build</button>
<button data-page="settings"><i>⚙</i>设置</button>
</nav><div class="sidefoot"><span class="dot" id="dot"></span><b id="status">Docker Engine 未连接</b><div id="ver">独立 Linux VM · Apple Silicon</div><div>不更改 OrbStack / 默认 Docker Context</div></div></aside>
<main><header><div><h1 id="title">总览</h1><div class="subtitle" id="subtitle">标准 Docker Engine · containerd · runc</div></div><div class="spacer"></div><input id="search" placeholder="搜索当前页面"><button class="btn" id="refresh">刷新</button><button class="btn primary" id="power">启动 VM</button></header><section id="content"></section></main>
<div id="toast"></div><div id="overlay"><div id="modal"><div class="modalhead"><strong id="modalTitle">详情</strong><button id="modalClose" class="btn">关闭</button></div><pre id="modalText"></pre></div></div>
<script>
"use strict";
const d=id=>document.getElementById(id);
const s={online:false,containers:[],images:[],volumes:[],networks:[],shares:[],info:{},version:{},page:"dashboard",search:""};
const pageNames={dashboard:"总览",containers:"容器",images:"镜像",volumes:"Volume",networks:"网络",compose:"Compose",build:"Build",settings:"设置"};
function send(x){window.webkit?.messageHandlers?.kiri?.postMessage(JSON.stringify(x))}
function el(tag,cls,txt){const o=document.createElement(tag);if(cls)o.className=cls;if(txt!==undefined)o.textContent=String(txt);return o}
function btn(label,fn,cls){const b=el("button","btn "+(cls||""),label);b.onclick=fn;return b}
function line(name,sub){const o=el("div");o.append(el("span","name",name));if(sub)o.append(el("small","",sub));return o}
function tool(title,buttons){const o=el("div","toolbar");o.append(el("h2","",title));const a=el("div","buttons");(buttons||[]).forEach(b=>a.append(b));o.append(a);return o}
function table(cols,rows){const o=el("div","table");if(!rows.length){o.append(el("div","empty","暂无数据"));return o}const t=el("table"),th=el("thead"),head=el("tr");cols.forEach(c=>head.append(el("th","",c)));th.append(head);t.append(th);const tbody=el("tbody");rows.forEach(cells=>{const row=el("tr");cells.forEach(c=>{const td=el("td");if(c instanceof Node)td.append(c);else td.textContent=String(c??"");row.append(td)});tbody.append(row)});t.append(tbody);o.append(t);return o}
function toast(txt,bad){const o=d("toast");o.textContent=txt;o.classList.toggle("error",!!bad);o.style.display="block";clearTimeout(window.kiriToast);window.kiriToast=setTimeout(()=>o.style.display="none",6500)}
function confirmDelete(txt){return window.confirm(txt)}
function filtered(list,fn){const q=s.search.trim().toLowerCase();return q?list.filter(x=>fn(x).toLowerCase().includes(q)):list}
function fmtBytes(value){let n=Number(value),i=0,t=["B","KB","MB","GB","TB"];if(!Number.isFinite(n))return "—";while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+" "+t[i]}
function state(c){return el("span","pill "+(c.State==="running"?"running":""),c.Status||c.State||"unknown")}
function action(type,cmd,extra,warn){return btn(type,()=>{if(warn&&!confirmDelete(warn))return;send(Object.assign({cmd},extra||{}))},type==="删除"?"danger small":"small")}
function containerBtns(c){const b=el("div","buttons"),id=c.Id;
  if(c.State==="running"){b.append(action("停止","container",{action:"stop",id}),action("重启","container",{action:"restart",id}),action("暂停","container",{action:"pause",id}))}
  else if(c.State==="paused")b.append(action("恢复","container",{action:"unpause",id}));
  else b.append(action("启动","container",{action:"start",id}));
  b.append(btn("日志",()=>send({cmd:"moby",action:"logs",id}),"small"));
  b.append(btn("详情",()=>send({cmd:"moby",action:"inspect",kind:"containers",id}),"small"));
  b.append(action("删除","container",{action:"remove",id},"确定强制删除容器 "+(c.Names?.[0]||id)+"？"));return b}
function dashboard(root){const grid=el("div","grid");[
 ["运行中的容器",s.containers.filter(x=>x.State==="running").length],["全部容器",s.containers.length],["镜像",s.images.length],["数据卷",s.volumes.length]
 ].forEach(([title,n])=>{const c=el("div","metric");c.append(el("small","",title),el("strong","",n));grid.append(c)});root.append(grid);
  const info=el("div","card");info.append(el("h2","","标准 Moby Docker Engine"));info.append(el("p","",("Docker "+(s.version.Version||"—")+" · "+(s.info.Architecture||"arm64")+" · "+(s.info.Driver||"overlay2"))));info.append(el("p","",("CPU: "+(s.info.NCPU||"—")+"  ·  内存: "+fmtBytes(s.info.MemTotal)+"  ·  "+(s.info.OperatingSystem||"Linux VM"))));root.append(info);
  root.append(tool("最近容器",[btn("查看全部",()=>switchTo("containers"))]));root.append(table(["容器","镜像","状态","操作"],s.containers.slice(0,7).map(c=>[line(c.Names?.[0]?.slice(1)||c.Id.slice(0,12),c.Id.slice(0,12)),c.Image,state(c),containerBtns(c)])))}
function containers(root){root.append(tool("容器",[btn("运行镜像",()=>{const name=window.prompt("镜像，例如 nginx:alpine");if(name?.trim())send({cmd:"run",name:name.trim()})},"primary")]));
  root.append(table(["容器","镜像","状态","端口","操作"],filtered(s.containers,c=>(c.Names||[]).join(" ")+c.Id+c.Image).map(c=>{
    const ports=(c.Ports||[]).filter(p=>p.PublicPort),p=el("div"),web=ports.find(p=>p.Type==="tcp");
    p.append(el("span","",ports.map(x=>x.PublicPort+" → "+x.PrivatePort+"/"+x.Type).join(", ")||"—"));
    if(web)p.append(btn("打开",()=>send({cmd:"moby",action:"open_local",url:"http://127.0.0.1:"+web.PublicPort+"/"}),"small"));
    return [line(c.Names?.[0]?.slice(1)||c.Id.slice(0,12),c.Id.slice(0,12)),c.Image,state(c),p,containerBtns(c)]
  })))}
function images(root){root.append(tool("镜像",[btn("拉取镜像",()=>{const name=window.prompt("镜像名称，例如 alpine:3.22");if(name?.trim())send({cmd:"pull",name:name.trim()})},"primary")]));
  root.append(table(["镜像","大小","创建时间","操作"],filtered(s.images,i=>(i.RepoTags||[]).join(",")+i.Id).map(i=>{
   const tag=(i.RepoTags||[]).find(x=>x!=="<none>:<none>")||i.Id,b=el("div","buttons");
   b.append(btn("运行",()=>send({cmd:"run",name:tag}),"small"),btn("详情",()=>send({cmd:"moby",action:"inspect",kind:"images",id:i.Id}),"small"),
    action("删除","rmi",{name:tag},"确定删除镜像 "+tag+"？"));
   return [line(i.RepoTags?.join(", ")||"<none>",i.Id?.slice(7,19)),fmtBytes(i.Size),i.Created?new Date(i.Created*1000).toLocaleString():"—",b]
 })))}
function volumes(root){root.append(tool("数据卷",[btn("创建 Volume",()=>{const name=window.prompt("新 Volume 名称");if(name?.trim())send({cmd:"moby",action:"create_volume",name:name.trim()})},"primary")]));
  root.append(table(["名称","驱动","路径","操作"],filtered(s.volumes,v=>v.Name+v.Driver).map(v=>{
   const b=el("div","buttons");b.append(btn("详情",()=>send({cmd:"moby",action:"inspect",kind:"volumes",id:v.Name}),"small"),action("删除","rmvol",{name:v.Name},"删除 Volume "+v.Name+"？可能丢失数据。"));return [line(v.Name),v.Driver||"local",el("span","mono",v.Mountpoint||"—"),b]
 })))}
function networks(root){root.append(tool("网络",[btn("创建网络",()=>{const name=window.prompt("网络名称");if(name?.trim())send({cmd:"moby",action:"create_network",name:name.trim()})},"primary")]));
  root.append(table(["网络","驱动","范围","操作"],filtered(s.networks,n=>n.Name+n.Id).map(n=>{
   const b=el("div","buttons");b.append(btn("详情",()=>send({cmd:"moby",action:"inspect",kind:"networks",id:n.Id}),"small"));
   if(!["bridge","host","none"].includes(n.Name))b.append(action("删除","rmnet",{id:n.Id},"确定删除网络 "+n.Name+"？"));
   return [line(n.Name,n.Id?.slice(0,12)),n.Driver||"—",n.Scope||"—",b]
 })))}
let composePath="",buildPath="",buildName="";
function field(label,value,onchange,placeholder){const o=el("div","field");o.append(el("label","",label));const i=el("input");i.value=value;i.placeholder=placeholder||"";i.oninput=()=>onchange(i.value);o.append(i);return o}
function compose(root){const card=el("div","card");card.append(el("h2","","Docker Compose"));const form=el("div","form");
  const file=field("Compose 文件路径",composePath,v=>composePath=v,"/Users/you/project/compose.yaml");file.classList.add("full");form.append(file);
  const row=el("div","row full");row.append(btn("选择 Compose 文件",()=>send({cmd:"moby",action:"choose_compose"})),
  btn("Up -d",()=>send({cmd:"moby",action:"compose_up",path:composePath}),"primary"),
  btn("查看状态",()=>send({cmd:"moby",action:"compose_ps",path:composePath})),
  btn("Down",()=>{if(confirmDelete("停止并删除 Compose 项目的容器？"))send({cmd:"moby",action:"compose_down",path:composePath})},"danger"));
  form.append(row);card.append(form);card.append(el("p","","使用标准 Docker Compose CLI，通过 Kiri Moby 独立 Socket 运行，不修改默认 Docker Context。"));root.append(card)}
function build(root){const card=el("div","card");card.append(el("h2","","Dockerfile / BuildKit"));const form=el("div","form");
  form.append(field("构建目录",buildPath,v=>buildPath=v,"/Users/you/project"),field("镜像 Tag",buildName,v=>buildName=v,"my-app:latest"));
  const row=el("div","row full");row.append(btn("构建镜像",()=>send({cmd:"moby",action:"build",path:buildPath,name:buildName}),"primary"));form.append(row);card.append(form);root.append(card)}
function settings(root){const card=el("div","card");card.append(el("h2","","Kiri Moby VM"));
  card.append(el("p","","使用独立标准 Docker Engine、ext4 数据盘和私有 Docker Socket。不会覆盖 OrbStack。"));
  const row=el("div","row");row.append(btn("启动 VM",()=>send({cmd:"connect"}),"primary"),btn("停止 VM",()=>{if(confirmDelete("停止 VM 和正在运行的容器？"))send({cmd:"stop"})},"danger"));
  card.append(row);root.append(card);
  const shares=el("div","card");shares.append(el("h2","","Mac 目录共享"));
  shares.append(el("p","","选择允许 Docker 容器访问的 Mac 项目目录；未经授权不会共享整个 /Users 或 /Volumes。更改后需要重启 VM 才能生效。"));
  const authorized=s.shares||[];
  if(!authorized.length)shares.append(el("p","","尚未授权目录"));
  authorized.forEach(path=>{
    const row=el("div","row");row.style.marginBottom="9px";
    const name=el("span","mono",path);name.style.flex="1";name.style.overflowWrap="anywhere";
    row.append(name,btn("移除",()=>{if(confirmDelete("移除对 "+path+" 的共享授权？"))send({cmd:"moby",action:"remove_share",path})},"danger small"));shares.append(row);
  });
  const buttons=el("div","row");
  buttons.append(btn("选择共享目录…",()=>send({cmd:"moby",action:"choose_share"}),"primary"));
  buttons.append(btn("应用更改并重启 VM",()=>{
    if(confirmDelete("重启 Moby VM 以应用目录授权？运行中的容器会被中断。"))send({cmd:"moby",action:"apply_shares"})
  }));
  shares.append(buttons);root.append(shares)}
const pages={dashboard,containers,images,volumes,networks,compose,build,settings};
function render(){d("title").textContent=pageNames[s.page];["containers","images","volumes","networks"].forEach(k=>d("count-"+k).textContent=s[k].length);
  d("status").textContent=s.online?"Moby Docker Engine 已连接":"Moby VM 未连接";d("dot").classList.toggle("on",s.online);
  d("ver").textContent=s.version.Version?"Docker "+s.version.Version+" · "+(s.info.Architecture||"arm64"):"Apple Silicon · 独立容器环境";
  d("power").textContent=s.online?"停止 VM":"启动 VM";
  const out=d("content");out.replaceChildren();
  if(!s.online&&s.page!=="settings"){const box=el("div","card");box.append(el("h2","","Moby VM 未连接"),el("p","",s.error||"启动标准 Docker Engine 后显示容器和镜像。"));box.append(btn("启动 VM",()=>send({cmd:"connect"}),"primary"));out.append(box);return}
  (pages[s.page]||dashboard)(out)}
function switchTo(page){s.page=page;s.search="";d("search").value="";document.querySelectorAll("nav button").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>switchTo(b.dataset.page));
d("search").oninput=e=>{s.search=e.target.value;render()};
d("refresh").onclick=()=>send({cmd:"refresh"});
d("power").onclick=()=>{if(s.online&&!confirmDelete("停止 Moby VM？"))return;send({cmd:s.online?"stop":"connect"})};
d("modalClose").onclick=()=>d("overlay").style.display="none";
d("overlay").onclick=e=>{if(e.target===d("overlay"))d("overlay").style.display="none"};
window.kiri={on(e){if(!e||typeof e!=="object")return;
 if(e.type==="snapshot"){Object.assign(s,{online:!!e.online,containers:e.containers||[],images:e.images||[],volumes:e.volumes||[],networks:e.networks||[],shares:e.shares||[],info:e.info||{},version:e.version||{},error:e.error});render()}
 else if(e.type==="operation"){if(e.ok&&["inspect","logs","compose_ps","compose_up","compose_down","build"].includes(e.label)){d("modalTitle").textContent=e.label;d("modalText").textContent=e.message||"完成";d("overlay").style.display="flex"}else toast(e.label+": "+(e.message||"完成"),!e.ok)}
 else if(e.type==="vm"){d("subtitle").textContent=e.state==="starting"?"正在启动 VM…":e.state==="stopping"?"正在停止 VM…":"标准 Docker Engine"}
 else if(e.type==="selected_compose"){composePath=e.path||"";if(s.page==="compose")render()}
 else if(e.type==="detail")switchTo("containers");
}};
render();send({cmd:"connect"});
</script></body></html>
