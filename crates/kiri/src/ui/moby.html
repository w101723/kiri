.sh-node { flex: none; width: 96px; display: grid; justify-items: center; gap: 7px; font-size: var(--fs-small); color: var(--muted); }
.sh-node span { max-width: 100%; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-node em { font-style: normal; color: var(--faint); }
.sh-nic { width: 44px; height: 44px; border-radius: 12px; display: grid; place-items: center; background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); color: var(--blue-light); }
.sh-nic > svg.i { width: 22px; height: 22px; }
.sh-nic .tile { width: 44px; height: 44px; border-radius: 12px; }
.sh-node.kiri .sh-nic { background: color-mix(in srgb, var(--sun) 12%, var(--raised)); color: var(--text); }
.sh-node.kiri svg { width: 32px; height: 32px; }
.sh-nic.hit { animation: sh-hit .5s ease-out; }
.sh-lane { position: relative; flex: 1; height: 2px; margin-top: 21px; border-radius: 1px;
           clip-path: inset(-6px 0); }
/* The dashes slide by transform (no repaint), clipped to the lane's length. */
.sh-lane::before { content: ""; position: absolute; top: 0; bottom: 0; left: -24px; right: 0; border-radius: inherit;
                   background: repeating-linear-gradient(90deg, color-mix(in srgb, var(--moss) 55%, transparent) 0 6px, transparent 6px 12px);
                   animation: sh-flowing 1.2s linear infinite; }
.sh-lane i { position: absolute; top: -3px; left: 0; width: 8px; height: 8px; border-radius: 50%; background: var(--moss);
             box-shadow: 0 0 8px var(--moss); opacity: 0; animation: sh-travel .55s ease-in-out forwards; }
.sh-feed { width: 100%; min-width: 0; display: grid; gap: 4px; padding: 10px 12px; border-radius: 9px; background: var(--raised); text-align: var(--start);
           font: var(--fs-log)/1.5 var(--mono-font); color: var(--muted); }
.sh-feed > * { min-width: 0; }
.sh-feed-k { font: var(--fs) var(--ui-font); color: var(--muted); }
.sh-log > div { display: flex; gap: 8px; animation: sh-fade .3s ease-out; }
.sh-feed b { font-weight: 600; color: var(--text); }
.sh-feed .ms { flex: none; }
.sh-feed .path { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sh-feed .ok { color: var(--moss); } .sh-feed .bad { color: var(--red-text); }
@keyframes sh-flowing { to { transform: translateX(24px); } }
@keyframes sh-travel { 0% { left: 0; opacity: 0; } 15% { opacity: 1; } 85% { opacity: 1; } 100% { left: calc(100% - 8px); opacity: 0; } }
@keyframes sh-hit { 40% { box-shadow: inset 0 0 0 1px var(--moss), 0 0 0 5px color-mix(in srgb, var(--moss) 25%, transparent); } }
.sh-dlg-foot { width: 100%; min-width: 0; display: flex; align-items: center; gap: 12px; margin-top: 8px; }
.sh-dlg-foot .linkish { font-size: var(--fs); }
.sh-dlg-foot .spacer { flex: 1; }
.sh-dlg-foot .linkish.danger { color: var(--red-text); }
@keyframes sh-fade { from { opacity: 0; } }
@keyframes sh-rise { from { opacity: 0; transform: translateY(8px) scale(.98); } }
.sh-led { position: relative; width: 7px; height: 7px; border-radius: 50%; background: var(--moss); }
.sh-chip { display: inline-flex; align-items: center; gap: 5px; height: 19px; padding: 0 7px; border-radius: 10px; border: 0; cursor: pointer; max-width: 100%;
           background: color-mix(in srgb, var(--moss) 14%, transparent); color: var(--text); font: 500 var(--fs-small) var(--mono-font); }
.sh-chip:hover { background: color-mix(in srgb, var(--moss) 26%, transparent); }
.sh-chip .sh-led { width: 6px; height: 6px; }
.sh-code { font: 600 var(--fs-title) var(--mono-font); letter-spacing: .14em; text-align: center; padding: 8px 0; }
/* Every live dot's pulse is a ring that grows and fades: transform and
   opacity only, which the GPU animates without repainting. (A growing
   box-shadow repainted every frame: about 18% of a core on Share.)
   `--ring` is how far it grows. */
@keyframes ring { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(var(--ring, 2.3)); opacity: 0; } }
/* They beat together, once every few seconds (`beat` in the script), and
   rest in between with nothing to draw; not at all while Kiri isn't the
   window in use. */
body { --beat: none; }
/* Nothing moves while Kiri isn't the window in use (`away` in the script). */
body.away *, body.away *::before, body.away *::after { animation-play-state: paused !important; }
body.beat { --beat: ring 1.6s ease-out; }
@keyframes sh-blink { 50% { opacity: .35; } }
/* Diagnostics: Settings → Diagnostics, the card after a crash, an error's Details. */
.dg-part { display: inline-flex; align-items: center; height: 18px; padding: 0 6px; border-radius: 4px; font: 600 var(--fs-small) var(--ui-font); letter-spacing: .02em;
           color: var(--muted); background: var(--row-hover); box-shadow: inset 0 0 0 1px var(--line); white-space: nowrap; }
.lnk { border: 0; background: none; padding: 0; font: inherit; color: var(--blue-light); cursor: pointer; }
/* Under Containers' table: how many are in Compose projects, with a link there. */
.ctr-more { margin: 10px 0 0; padding-inline: 16px; color: var(--muted); font-size: var(--fs); }
.ctr-more .lnk:hover, .ctr-allcmp .lnk:hover { text-decoration: underline; text-underline-offset: 3px; }
.lnk:hover { text-decoration: underline; }
.diag .pref .dg-acts { grid-row: 1 / span 2; grid-column: 2; display: flex; gap: 8px; }
.diag .btn svg, .dt-foot .btn svg, .rp-dialog .btn svg, .updcard .btn svg { width: 14px; height: 14px; fill: currentColor; }
.dg-result { grid-column: 1 / -1; display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 8px 10px; border-radius: 8px; font-size: var(--fs);
             background: color-mix(in srgb, var(--moss) 10%, transparent); box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--moss) 30%, var(--line)); }
.dg-result > svg { width: 15px; height: 15px; fill: var(--moss); flex: none; }
.dg-result .mono { color: var(--text); user-select: text; -webkit-user-select: text; }
.dg-crashes { display: grid; border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.dg-crashes .none { padding: 14px 12px; color: var(--muted); font-size: var(--fs); }
.dg-crash { display: grid; grid-template-columns: 16px 104px 62px minmax(0, 1fr) auto; align-items: center; gap: 10px; min-height: 40px; padding-block: 6px; padding-inline: 8px 10px; cursor: pointer; }
.dg-crash + .dg-crash, .dg-stack + .dg-crash { border-top: 1px solid var(--line); }
.dg-crash:hover { background: var(--row-hover); }
.dg-crash .car { width: 16px; height: 16px; border: 0; padding: 0; background: none; color: var(--faint); cursor: pointer; display: grid; place-items: center; }
.dg-crash .car svg { width: 12px; height: 12px; fill: currentColor; transition: transform .15s; }
.dg-crash[aria-expanded=true] .car svg { transform: rotate(90deg); }
.dg-crash .when { color: var(--muted); font-size: var(--fs); white-space: nowrap; }
.dg-crash .first { font: var(--fs)/1.45 var(--mono-font); color: var(--text); overflow: hidden; display: -webkit-box; -webkit-box-orient: vertical; -webkit-line-clamp: 2; overflow-wrap: anywhere; }
.dg-crash .st { display: flex; align-items: center; gap: 6px; justify-content: flex-end; font-size: var(--fs); white-space: nowrap; }
.dg-crash .st .pill.sent::before { background: var(--moss); }
.dg-crash .st .mono { font-size: var(--fs-small); color: var(--muted); }
.dg-stack { margin: 0; padding-block: 10px 12px; padding-inline: 36px 12px; border-top: 1px solid var(--line); background: #0A0E12; color: #D9DEE4; font: var(--fs-small)/1.6 var(--mono-font);
            white-space: pre-wrap; overflow-wrap: anywhere; max-height: 320px; overflow-y: auto; user-select: text; -webkit-user-select: text; cursor: text; }
.dg-logs { display: grid; gap: 10px; }
.dg-logs .logbar { margin: 0; }
.dg-logs .logbar .field { width: 180px; height: 30px; font-size: var(--fs); }
.dg-logs .logbar .seg { grid-row: auto; grid-column: auto; }
.dg-logs .logbar .seg button { height: 28px; padding: 0 10px; }
.dg-chip { display: inline-flex; align-items: center; gap: 6px; height: 26px; padding-block: 0; padding-inline: 9px 4px; border-radius: 13px; font-size: var(--fs); color: var(--text);
           background: color-mix(in srgb, var(--blue) 16%, transparent); }
.dg-chip button { border: 0; background: none; color: var(--muted); cursor: pointer; display: inline-flex; padding: 2px; }
.dg-log { background: #0A0E12; border: 1px solid var(--line); border-radius: 10px; height: 280px; overflow: auto; padding: 6px 0; font: var(--fs-log)/1.5 var(--mono-font);
          color: #D9DEE4; user-select: text; -webkit-user-select: text; cursor: text; }
.dg-row { display: grid; grid-template-columns: 84px 38px 46px minmax(0, 1fr); gap: 8px; padding: 0 12px; }
.dg-row:hover { background: rgba(255, 255, 255, .04); }
.dg-row .t { color: #6B7682; font-variant-numeric: tabular-nums; }
.dg-row .lv { font-weight: 600; font-size: var(--fs-small); letter-spacing: .02em; }
.dg-row .p { color: #8C96A3; }
.dg-row .m { min-width: 0; white-space: pre-wrap; overflow-wrap: anywhere; }
.dg-row .m .k { color: #8C96A3; }
.dg-row.error { background: rgba(220, 53, 69, .10); }
.dg-row.error .lv, .dg-row.error .m { color: #FF8C8C; }
.dg-row.warn .lv { color: #FFC23D; }
.dg-row.info .lv { color: #8FD3FF; }
.dg-row.debug .lv, .dg-row.debug .m { color: #6B7682; }
.dg-row.error.hit { box-shadow: inset 2px 0 0 #FF8C8C; }
.dg-row mark { background: color-mix(in srgb, #FFC23D 35%, transparent); color: inherit; border-radius: 2px; }
.dg-empty { padding: 30px 12px; text-align: center; color: #6B7682; font-family: var(--ui-font); }
.dg-logfoot { display: flex; align-items: center; gap: 8px; font-size: var(--fs); color: var(--muted); }
.dg-live { display: inline-flex; align-items: center; gap: 6px; }
.dg-live i { width: 7px; height: 7px; border-radius: 50%; background: var(--moss); animation: pulse .9s infinite alternate; }
.dg-live.off i { background: var(--faint); animation: none; }
/* The card after a crash takes the update card's place. */
.updcard .ic.calm { color: var(--muted); background: var(--raised); box-shadow: inset 0 0 0 1px var(--line); }
.updcard .ic svg[viewBox="0 0 256 256"] { fill: currentColor; }
.updcard .sub .mono { color: var(--text); user-select: text; -webkit-user-select: text; }
.updcard .opt { display: flex; align-items: center; gap: 8px; font-size: var(--fs); cursor: pointer; }
.updcard .opt input, .rp-item input { margin: 0; accent-color: var(--blue); width: 14px; height: 14px; }
.updcard .row .lnk { margin-inline-start: auto; font-size: var(--fs); }
/* An error toast with Details and Copy. */
.toast.error .dg-tacts, .toast.ok .dg-tacts { display: flex; gap: 14px; margin-top: 5px; font-size: var(--fs); font-weight: 600; }
/* An error's Details: that one action's log lines. */
.dt-dialog { width: min(700px, calc(100% - 32px)); padding: 0; gap: 0; overflow: hidden; box-shadow: 0 24px 60px rgba(0, 0, 0, .35); animation: wn-in .2s ease-out; }
.dt-head { position: relative; display: grid; grid-template-columns: auto 1fr; gap: 3px 12px; padding-block: 18px 14px; padding-inline: 20px 50px; border-bottom: 1px solid var(--line); }
.dt-head .ic { grid-row: 1 / span 2; width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; color: var(--red-text); background: color-mix(in srgb, var(--red) 14%, transparent); }
.dt-head .ic svg { width: 18px; height: 18px; fill: currentColor; }
.dt-head h3 { font-size: var(--fs-head); }
.dt-head .close { position: absolute; top: 12px; inset-inline-end: 12px; width: 28px; height: 28px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); background: none; border: 0; cursor: pointer; }
.dt-head .close:hover { background: var(--row-hover); color: var(--text); }
.dt-meta { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 14px; padding: 10px 20px; font-size: var(--fs); color: var(--muted); border-bottom: 1px solid var(--line); }
.dt-meta .mono { color: var(--text); font-size: var(--fs-small); }
.dt-body { padding: 12px 20px 4px; }
.dt-body .dg-log { height: auto; min-height: 60px; max-height: 260px; }
.dt-foot { display: flex; align-items: center; gap: 8px; padding: 14px 20px; }
.dt-foot .lnk { margin-inline-end: auto; }
.dt-foot .ok { display: inline-flex; align-items: center; gap: 6px; font-size: var(--fs); color: var(--muted); }
.dt-foot .ok svg { width: 14px; height: 14px; fill: var(--moss); }
.dt-foot .ok .mono { color: var(--text); user-select: text; -webkit-user-select: text; }
.dt-foot .err { font-size: var(--fs); color: var(--red-text); }
/* Create report… and Send to Kiri: what goes in, and the id once sent. */
.rp-dialog { width: min(500px, calc(100% - 32px)); }
.rp-list { display: grid; border: 1px solid var(--line); border-radius: 9px; overflow: hidden; }
.rp-item { display: grid; grid-template-columns: 14px 1fr; gap: 1px 10px; align-items: start; padding: 9px 12px; }
.rp-item + .rp-item { border-top: 1px solid var(--line); }
.rp-item > svg { width: 14px; height: 14px; fill: var(--moss); margin-top: 2px; grid-row: 1 / span 2; }
.rp-item input { margin-top: 2px; grid-row: 1 / span 2; }
.rp-item.opt { cursor: pointer; }
.rp-item .t { font-weight: 600; }
.rp-item .d { grid-column: 2; color: var(--muted); font-size: var(--fs); }
.rp-red { display: flex; gap: 8px; align-items: flex-start; font-size: var(--fs); color: var(--muted); line-height: 1.45; }
.rp-red svg { width: 15px; height: 15px; fill: var(--moss); flex: none; margin-top: 1px; }
.rp-id { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-radius: 10px; background: var(--bg); border: 1px solid var(--line); }
.rp-id .lab { color: var(--muted); font-size: var(--fs); }
.rp-id .val { font: 600 var(--fs-head) var(--mono-font); color: var(--text); user-select: text; -webkit-user-select: text; }
.rp-id .btn { margin-inline-start: auto; }
.rp-dialog .err { font-size: var(--fs); color: var(--red-text); }
/* --- The built-in terminal: a panel under the page (tests/ui/terminal.js) ----------- */
:root { --term-bg: #0B0F13; --term-fg: #D7DCE1; }
@media (prefers-color-scheme: light) { :root { --term-bg: #FFFFFF; --term-fg: #1F2328; } }
main { position: relative; }
/* Raised above the page: a shadow up onto it, a lighter top edge and a lifted
   header, so the panel never reads as more of the page. */
.htdrawer { flex: none; height: var(--ht-h, 300px); border-top: 1px solid color-mix(in srgb, var(--text) 16%, var(--line)); position: relative; z-index: 3; display: flex; flex-direction: column; min-height: 0; background: var(--panel);
  box-shadow: 0 -10px 28px rgb(0 0 0 / .32), 0 -1px 0 rgb(0 0 0 / .25); }
@media (prefers-color-scheme: light) { .htdrawer { box-shadow: 0 -8px 22px rgb(0 0 0 / .10); } }
.htdrawer[hidden] { display: none; }
.htdrawer.max { position: absolute; inset: 0; height: auto; border-top: 0; z-index: 10; }
.htgrip { position: absolute; top: -3px; inset-inline-start: 0; inset-inline-end: 0; height: 6px; cursor: row-resize; z-index: 5; }
.htdrawer.max .htgrip { display: none; }
.hthead { display: flex; align-items: center; height: 32px; padding-block: 0; padding-inline: 4px 6px; border-bottom: 1px solid var(--line); gap: 2px; flex: none; background: color-mix(in srgb, var(--raised) 75%, var(--panel)); }
.httabs { display: flex; align-items: center; gap: 2px; min-width: 0; overflow: hidden; }
.httab { display: flex; align-items: center; gap: 6px; height: 24px; padding-block: 0; padding-inline: 9px 4px; border-radius: 6px; color: var(--muted); cursor: pointer; white-space: nowrap; font-size: var(--fs); border: 0; background: none; font-family: inherit; }
.httab:hover { background: var(--row-hover); color: var(--text); }
.httab.on { background: var(--raised); color: var(--text); box-shadow: inset 0 0 0 1px var(--line); }
.httab .x { width: 16px; height: 16px; display: grid; place-items: center; border-radius: 4px; color: var(--faint); opacity: 0; }
.httab:hover .x, .httab.on .x { opacity: 1; }
.httab .pin { width: 16px; height: 16px; display: grid; place-items: center; color: var(--blue-light); }
.httab .pin svg { width: 11px; height: 11px; stroke-width: 2; }
.htctx { position: absolute; z-index: 35; width: 170px; padding: 5px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 40px rgb(0 0 0 / .45); }
.htctx[hidden] { display: none; }
.htctx .mi { display: flex; align-items: center; gap: 8px; width: 100%; height: 28px; padding: 0 8px; border: 0; border-radius: 6px; background: none; cursor: pointer; color: var(--text); font: var(--fs) var(--ui-font); text-align: var(--start); }
.htctx .mi:hover { background: var(--blue); color: #fff; }
.htctx .mi:disabled { color: var(--faint); background: none; cursor: default; }
.httab .x:hover { background: color-mix(in srgb, var(--text) 10%, transparent); color: var(--text); }
.hthead .grow { flex: 1; min-width: 10px; align-self: stretch; }
.hthead .sep { width: 1px; height: 16px; background: var(--line); margin: 0 4px; }
.hthead .sb { width: 26px; height: 26px; }
/* The panel's icons are lines: every one of them (tab ×, find arrows) gets a stroke. */
.htdrawer svg, .httoggle svg { fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
.httab .x svg { width: 11px; height: 11px; stroke-width: 2; }
.htfind .sb svg { width: 14px; height: 14px; }
.htwrap { position: relative; flex: none; }
.htbody { flex: 1; min-height: 0; display: flex; background: var(--term-bg); position: relative; }
.htsplit { display: flex; flex: 1; min-width: 0; min-height: 0; }
.htsplit.v { flex-direction: column; }
.htcell { display: flex; min-width: 0; min-height: 0; }
/* Thick enough to see where one pane ends, with a wider grab area. */
.htdiv { flex: none; background: color-mix(in srgb, var(--text) 12%, var(--panel)); position: relative; z-index: 2; transition: background-color .12s; }
.htsplit.h > .htdiv { width: 4px; cursor: col-resize; }
.htsplit.v > .htdiv { height: 4px; cursor: row-resize; }
.htdiv::after { content: ""; position: absolute; inset: -3px; }
.htdiv:hover, .htdiv.drag { background: var(--blue); }
.htpane { flex: 1; min-width: 0; min-height: 0; display: flex; flex-direction: column; position: relative; }
.htpt { flex: none; height: 20px; display: none; align-items: center; gap: 6px; padding: 0 8px; font-size: var(--fs-small); color: var(--faint); border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); white-space: nowrap; overflow: hidden; }
.htbody.many .htpt { display: flex; }
.htname { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.htpx { width: 16px; height: 16px; display: grid; place-items: center; padding: 0; border: 0; border-radius: 4px; background: none; color: var(--faint); cursor: pointer; flex: none; opacity: 0; }
.htpane:hover .htpx, .htpane.focus .htpx { opacity: 1; }
.htpx:hover { background: color-mix(in srgb, var(--text) 10%, transparent); color: var(--text); }
.htpx svg { width: 10px; height: 10px; stroke-width: 2; }
.htpane.focus .htpt { color: var(--muted); }
.htpane.focus .htpt::before { content: ""; width: 5px; height: 5px; border-radius: 50%; background: var(--blue-light); flex: none; }
.htbody.many .htpane:not(.focus) .htx { opacity: .62; }
.htbody.zoomed .htsplit > .htdiv, .htbody.zoomed .htcell:not(:has(.htpane.focus)), .htbody.zoomed .htpane:not(.focus) { display: none; }
/* xterm measures the page in pixels: the window's text size (zoom on the
   body) is undone here, and the terminal has its own size instead. */
.htx { flex: 1; min-height: 0; min-width: 0; padding-block: 4px 0; padding-inline: 10px 0; zoom: var(--ht-unzoom, 1); }
.htx .xterm { height: 100%; }
.htx .xterm-viewport { scrollbar-width: thin; }
.htmsg { position: absolute; left: 50%; top: 40%; transform: translate(-50%, -50%); max-width: 80%; text-align: center; color: var(--muted); }
.htmsg b { display: block; color: var(--text); margin-bottom: 4px; }
.htpop, .htmenu { position: absolute; z-index: 30; top: 30px; background: var(--raised); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 14px 40px rgb(0 0 0 / .45); }
.htpop[hidden], .htmenu[hidden] { display: none; }
.htpop { inset-inline-end: 0; width: 248px; padding: 12px; }
.htpop .row { display: flex; align-items: center; gap: 8px; }
.htpop .lbl { color: var(--muted); font-size: var(--fs-small); margin-bottom: 6px; display: flex; justify-content: space-between; }
.htpop .lbl b { color: var(--text); font-variant-numeric: tabular-nums; }
.htpop input[type=range] { flex: 1; accent-color: var(--blue); }
.htpop .st { width: 24px; height: 24px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); cursor: pointer; font: 600 var(--fs-head) var(--ui-font); }
.htpop hr { border: 0; border-top: 1px solid var(--line); margin: 10px 0; }
.htpop select { width: 100%; height: 26px; background: var(--panel); color: var(--text); border: 1px solid var(--line); border-radius: 6px; font: var(--fs) var(--ui-font); padding: 0 6px; }
.htpop .keys { color: var(--faint); font-size: var(--fs-small); margin-top: 8px; line-height: 1.8; }
.htmenu { inset-inline-start: 0; width: 230px; padding: 5px; max-height: 320px; overflow: auto; }

@media (prefers-reduced-motion: reduce) { .usb-busy .spin { animation-duration: 2.4s; } }

/* --- right to left (Arabic) ---------------------------------------------------------
   The window mirrors by itself: <html dir=rtl> turns the grid, every flex row
   and table around, and the rules above are written in start and end. What is
   left for here:
   - Text. Names, images, ports, sizes and paths are Latin inside an Arabic
     window. unicode-bidi: plaintext gives every element the direction of its
     own first letter, so "postgres (localhost:5432)" or "50.0 MB" reads as
     written and an Arabic sentence reads right to left, with the names inside
     it kept whole. Alignment then can't follow the text (a Latin name would
     sit on the left of its column), so it's said outright: right by default,
     var(--start) and var(--end) where a rule names a side.
   - What is always left to right: logs, the terminal, code, drawings.
   - Arrows that point along the reading direction. */
[dir=rtl] body { text-align: right; }
[dir=rtl] body :not(svg, svg *) { unicode-bidi: plaintext; }
[dir=rtl] :is(.console, .xterm, .term, pre, .yard, .is-art, .sh-lane, .lcloud, svg text) { direction: ltr; }
/* The terminal's panes keep their sides: Split right opens on the right. What is said over them reads right to left again. */
[dir=rtl] .htbody { direction: ltr; }
[dir=rtl] :is(.htmsg, .htask, .httoast) { direction: rtl; }
/* A field starts on the right whatever is typed in it, beside its label or
   its icon. Its hint is laid out apart from it: an address or a name there
   reads as written too. */
:where([dir=rtl]) :where(input, textarea) { text-align: right; }
[dir=rtl] ::placeholder { unicode-bidi: plaintext; }
/* A page's title is one line: USB and its Beta mark keep the reading order. */
[dir=rtl] .toolbar h2 { unicode-bidi: normal; }
/* A language's line in the language step: its own name, its English name and
   Same as macOS run the way the window does, each kept whole. */
[dir=rtl] .langdlg .lnm { unicode-bidi: isolate; }
[dir=rtl] :is(.console, .xterm) :not(svg, svg *) { unicode-bidi: normal; }
[dir=rtl] :is(.console, .term, .term input, pre) { text-align: left; }
/* Two buttons with only a space between them (a dialog's Cancel and its
   action): no letter there says which way the pair runs, so it would stay
   left to right. It runs the way the window does. */
[dir=rtl] body :has(> button + button) { unicode-bidi: isolate; }
/* A path reads from its root, left to right, and still starts at the right edge like everything else. */
[dir=rtl] .crumbs { direction: ltr; justify-content: flex-end; }
/* Arabic letters join: spacing them apart breaks the word. */
[dir=rtl] body :not(.sh-codebox span, .sh-code) { letter-spacing: 0 !important; }
/* The caret points the way you read: forward is left, back is right. */
[dir=rtl] :is(.sb.chev, .sh-row, .usb-caret, .need .disc, .dg-crash .car) svg { transform: scaleX(-1); }
[dir=rtl] :is(.sb.back, .pp-head .sb) svg { transform: none; }
[dir=rtl] .sh-row:hover .sh-caret { transform: scaleX(-1) translateX(2px); }
[dir=rtl] :is(.need .disc[aria-expanded=true], .dg-crash[aria-expanded=true] .car, .usb-row.open .usb-caret) svg { transform: rotate(90deg); }
/* The folded sidebar's small globes shrink toward their own corner. */
[dir=rtl] body.rail nav .sh-globes { transform-origin: top left; }
/* The note beside Run sits on the button's other side, its tip turned to it. */
[dir=rtl] .run-tip { transform: translate(10px, -50%); }
[dir=rtl] .run-tip::after { transform: translateY(-50%) rotate(-135deg); }
/* The same for arrows that are characters: Containers › web, a group's ▸, host → container. */
[dir=rtl] :is(.crumb > span[aria-hidden], .sh-chev, tr.group .chev, .ctx-flow .arr, .port-row .arrow, .wn-arrow) { display: inline-block; transform: scaleX(-1); }
</style>

function send(x){window.webkit?.messageHandlers?.kiri?.postMessage(JSON.stringify(x))}
function el(tag,cls,txt){const o=document.createElement(tag);if(cls)o.className=cls;if(txt!==undefined)o.textContent=String(txt);return o}

function tool(title,buttons){const o=el("div","toolbar");o.append(el("h2","",title));const a=el("div","buttons");(buttons||[]).forEach(b=>a.append(b));o.append(a);return o}
function table(cols,rows){const o=el("div","table");if(!rows.length){o.append(el("div","empty","暂无数据"));return o}const t=el("table"),th=el("thead"),head=el("tr");cols.forEach(c=>head.append(el("th","",c)));th.append(head);t.append(th);const tbody=el("tbody");rows.forEach(cells=>{const row=el("tr");cells.forEach(c=>{const td=el("td");if(c instanceof Node)td.append(c);else td.textContent=String(c??"");row.append(td)});tbody.append(row)});t.append(tbody);o.append(t);return o}

function confirmDelete(txt){return window.confirm(txt)}
function filtered(list,fn){const q=s.search.trim().toLowerCase();return q?list.filter(x=>fn(x).toLowerCase().includes(q)):list}
function fmtBytes(value){let n=Number(value),i=0,t=["B","KB","MB","GB","TB"];if(!Number.isFinite(n))return "—";while(n>=1024&&i<4){n/=1024;i++}return n.toFixed(i?1:0)+" "+t[i]}
function state(c){return el("span","pill "+(c.State==="running"?"running":""),c.Status||c.State||"unknown")}
function action(type,cmd,extra,warn){return btn(type,()=>{if(warn&&!confirmDelete(warn))return;send(Object.assign({cmd},extra||{}))},type==="删除"?"danger small":"small")}
function containerBtns(c){const b=el("div","buttons"),id=c.Id;
  if(c.State==="running"){b.append(action("停止","container",{action:"stop",id}),action("重启","container",{action:"restart",id}),action("暂停","container",{action:"pause",id}))}
  else if(c.State==="paused")b.append(action("恢复","container",{action:"unpause",id}));
  else b.append(action("启动","container",{action:"start",id}));
  if(c.State==="running")b.append(btn("执行",()=>{
    const command=window.prompt("在容器中执行命令（使用 sh -c）","pwd");
    if(command?.trim())send({cmd:"moby",action:"exec",id,command:command.trim()})
  },"small"));
  b.append(btn("日志",()=>send({cmd:"moby",action:"logs",id}),"small"));
  b.append(btn("详情",()=>send({cmd:"moby",action:"inspect",kind:"containers",id}),"small"));
  b.append(action("删除","container",{action:"remove",id},"确定强制删除容器 "+(c.Names?.[0]||id)+"？"));return b}
function dashboard(root){const grid=el("div","grid");[
 ["运行中的容器",s.containers.filter(x=>x.State==="running").length],["全部容器",s.containers.length],["镜像",s.images.length],["数据卷",s.volumes.length]
 ].forEach(([title,n])=>{const c=el("div","metric");c.append(el("small","",title),el("strong","",n));grid.append(c)});root.append(grid);
  const info=el("div","card");info.append(el("h2","","标准 Moby Docker Engine"));info.append(el("p","",("Docker "+(s.version.Version||"—")+" · "+(s.info.Architecture||"arm64")+" · "+(s.info.Driver||"overlay2"))));info.append(el("p","",("CPU: "+(s.info.NCPU||"—")+"  ·  VM 配置上限: "+fmtBytes(s.info.MemTotal)+"  ·  "+(s.info.OperatingSystem||"Linux VM"))));
  if(Number.isFinite(Number(s.memory.balloon_target_mib))&&Number(s.memory.balloon_target_mib)>0){
    info.append(el("p","","当前 Balloon 内存目标: "+s.memory.balloon_target_mib+" MiB · Guest 可用: "+Math.round((s.memory.guest_available_kib||0)/1024)+" MiB"));
    info.append(el("p","","提示：Balloon 目标不等于 Mac 实际已释放内存；以系统内存压力/RSS 为准。"));
  }
  root.append(info);
  root.append(tool("最近容器",[btn("查看全部",()=>switchTo("containers"))]));root.append(table(["容器","镜像","状态","操作"],s.containers.slice(0,7).map(c=>[line(c.Names?.[0]?.slice(1)||c.Id.slice(0,12),c.Id.slice(0,12)),c.Image,state(c),containerBtns(c)])))}
let containerFilter="all";
const collapsedProjects=new Set();
function containerState(c){if(c.State==="running")return"running";if(c.State==="paused")return"stopped";if(c.State==="dead"||c.State==="removing"||/^exited \(([1-9][0-9]*)\)/i.test(c.Status||""))return"failed";return"stopped"}
function projectName(c){return c.Labels?.["com.docker.compose.project"]||""}
function containerRow(c,nested){
 const tr=el("tr","container-row"+(nested?" nested":""));
 const name=c.Names?.[0]?.replace(/^\//,"")||c.Id?.slice(0,12)||"—";
 const make=v=>{const td=el("td");if(v instanceof Node)td.append(v);else td.textContent=String(v??"");tr.append(td);return td};
 const box=el("div");box.append(el("span","name",name));box.append(el("small","",c.Image||""));make(box);
 const stateCell=el("span");stateCell.append(el("span","state-dot "+(c.State==="running"?"running":"")));stateCell.append(document.createTextNode(c.Status||c.State||"—"));make(stateCell);
 const ports=el("div");let exposed=(c.Ports||[]).filter(p=>p.PublicPort);
 if(!exposed.length)ports.textContent="—";
 exposed.forEach((p,i)=>{if(i)ports.append(document.createTextNode(", "));if(p.Type==="tcp"){const a=el("a","port",p.PublicPort+"→"+p.PrivatePort);a.href="#";a.onclick=e=>{e.preventDefault();send({cmd:"moby",action:"open_local",url:"http://127.0.0.1:"+p.PublicPort+"/"})};ports.append(a)}else ports.append(document.createTextNode(p.PublicPort+"→"+p.PrivatePort+"/"+p.Type))});
 make(ports);
 const share=el("span","", "—");make(share);
 const sz=Number(c.SizeRw);make(Number.isFinite(sz)&&sz>0?fmtBytes(sz):"—");
 make(c.Created?new Date(c.Created*1000).toLocaleDateString():"—");
 make(containerBtns(c));
 return tr
}
function containers(root){
 const cols=["NAME","STATE","PORTS","SHARE","SIZE","CREATED","ACTIONS"];
 const filteredItems=filtered(s.containers,c=>(c.Names||[]).join(" ")+c.Id+c.Image)
    .filter(c=>containerFilter==="all"||containerState(c)===containerFilter);
 const box=el("div","table");root.append(box);
 if(!filteredItems.length){box.append(el("div","empty",s.containers.length?"没有符合条件的容器":"暂无容器"));return}
 const tableEl=el("table"),head=el("thead"),tr=el("tr");
 cols.forEach(col=>tr.append(el("th","",col)));head.append(tr);tableEl.append(head);
 const body=el("tbody");
 const groups=new Map();
 for(const c of filteredItems){const name=projectName(c);if(name){if(!groups.has(name))groups.set(name,[]);groups.get(name).push(c)}}
 const used=new Set();
 for(const c of filteredItems){
   const group=projectName(c);
   if(group){
     if(used.has(group))continue; used.add(group);
     const members=groups.get(group),open=!collapsedProjects.has(group);
     const groupTr=el("tr","project-row"),td=el("td");td.colSpan=cols.length;
     td.append(document.createTextNode((open?"▾":"▸")+"  "+group));
     td.append(el("span","",members.filter(x=>x.State==="running").length+" / "+members.length+" running"));
     groupTr.append(td);groupTr.onclick=()=>{if(open)collapsedProjects.add(group);else collapsedProjects.delete(group);render()};
     body.append(groupTr);
     if(open)members.forEach(item=>body.append(containerRow(item,true)));
   }else body.append(containerRow(c,false))
 }
 tableEl.append(body);box.append(tableEl);
}
function images(root){root.append(tool("镜像",[btn("拉取镜像",()=>{const name=window.prompt("镜像名称，例如 alpine:3.22");if(name?.trim())send({cmd:"pull",name:name.trim()})},"primary")]));
  root.append(table(["镜像","大小","创建时间","操作"],filtered(s.images,i=>(i.RepoTags||[]).join(",")+i.Id).map(i=>{
   const tag=(i.RepoTags||[]).find(x=>x!=="<none>:<none>")||i.Id,b=el("div","buttons");
   b.append(btn("运行",()=>send({cmd:"run",name:tag}),"small"),btn("详情",()=>send({cmd:"moby",action:"inspect",kind:"images",id:i.Id}),"small"),
    action("删除","rmi",{name:tag},"确定删除镜像 "+tag+"？"));
   return [line(i.RepoTags?.join(", ")||"<none>",i.Id?.slice(7,19)),fmtBytes(i.Size),i.Created?new Date(i.Created*1000).toLocaleString():"—",b]
 })))}
function volumes(root){root.append(tool("数据卷",[btn("创建 Volume",()=>{const name=window.prompt("新 Volume 名称");if(name?.trim())send({cmd:"moby",action:"create_volume",name:name.trim()})},"primary")]));
  root.append(table(["名称","驱动","路径","操作"],filtered(s.volumes,v=>v.Name+v.Driver).map(v=>{
   const b=el("div","buttons");b.append(btn("详情",()=>send({cmd:"moby",action:"inspect",kind:"volumes",id:v.Name}),"small"),action("删除","rmvol",{name:v.Name},"删除 Volume "+v.Name+"？可能丢失数据。"));return [line(v.Name),v.Driver||"local",el("span","mono",v.Mountpoint||"—"),b]
 })))}
function networks(root){root.append(tool("网络",[btn("创建网络",()=>{const name=window.prompt("网络名称");if(name?.trim())send({cmd:"moby",action:"create_network",name:name.trim()})},"primary")]));
  root.append(table(["网络","驱动","范围","操作"],filtered(s.networks,n=>n.Name+n.Id).map(n=>{
   const b=el("div","buttons");b.append(btn("详情",()=>send({cmd:"moby",action:"inspect",kind:"networks",id:n.Id}),"small"));
   if(!["bridge","host","none"].includes(n.Name))b.append(action("删除","rmnet",{id:n.Id},"确定删除网络 "+n.Name+"？"));
   return [line(n.Name,n.Id?.slice(0,12)),n.Driver||"—",n.Scope||"—",b]
 })))}
let composePath="",buildPath="",buildName="",buildPlatform="linux/arm64";
function field(label,value,onchange,placeholder){const o=el("div","field");o.append(el("label","",label));const i=el("input");i.value=value;i.placeholder=placeholder||"";i.oninput=()=>onchange(i.value);o.append(i);return o}
function compose(root){const card=el("div","card");card.append(el("h2","","Docker Compose"));const form=el("div","form");
  const file=field("Compose 文件路径",composePath,v=>composePath=v,"/Users/you/project/compose.yaml");file.classList.add("full");form.append(file);
  const row=el("div","row full");row.append(btn("选择 Compose 文件",()=>send({cmd:"moby",action:"choose_compose"})),
  btn("Up -d",()=>send({cmd:"moby",action:"compose_up",path:composePath}),"primary"),
  btn("查看状态",()=>send({cmd:"moby",action:"compose_ps",path:composePath})),
  btn("查看日志",()=>send({cmd:"moby",action:"compose_logs",path:composePath})),
  btn("Down",()=>{if(confirmDelete("停止并删除 Compose 项目的容器？"))send({cmd:"moby",action:"compose_down",path:composePath})},"danger"));
  form.append(row);card.append(form);card.append(el("p","","使用标准 Docker Compose CLI，通过 Kiri Moby 独立 Socket 运行，不修改默认 Docker Context。"));root.append(card)}
function build(root){const card=el("div","card");card.append(el("h2","","Dockerfile / BuildKit"));const form=el("div","form");
  form.append(field("构建目录",buildPath,v=>buildPath=v,"/Users/you/project"),field("镜像 Tag",buildName,v=>buildName=v,"my-app:latest"));
  const platformField=el("div","field full");platformField.append(el("label","","目标架构"));
  const selector=el("select");selector.style.cssText="background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:8px;padding:8px 12px";
  ["linux/arm64","linux/amd64"].forEach(v=>{const option=el("option","",v);option.value=v;selector.append(option)});
  selector.value=buildPlatform;selector.onchange=()=>buildPlatform=selector.value;
  platformField.append(selector);form.append(platformField);
  const row=el("div","row full");row.append(btn("构建镜像",()=>send({cmd:"moby",action:"build",path:buildPath,name:buildName,platform:buildPlatform}),"primary"));form.append(row);card.append(form);root.append(card)}
function settings(root){const card=el("div","card");card.append(el("h2","","Kiri Moby VM"));
  card.append(el("p","","使用独立标准 Docker Engine、ext4 数据盘和私有 Docker Socket。不会覆盖 OrbStack。"));
  const row=el("div","row");row.append(btn("启动 VM",()=>send({cmd:"connect"}),"primary"),btn("停止 VM",()=>{if(confirmDelete("停止 VM 和正在运行的容器？"))send({cmd:"stop"})},"danger"));
  card.append(row);root.append(card);
  const shares=el("div","card");shares.append(el("h2","","Mac 目录共享"));
  shares.append(el("p","","选择允许 Docker 容器访问的 Mac 项目目录；未经授权不会共享整个 /Users 或 /Volumes。更改后需要重启 VM 才能生效。"));
  const authorized=s.shares||[];
  if(!authorized.length)shares.append(el("p","","尚未授权目录"));
  authorized.forEach(path=>{
    const row=el("div","row");row.style.marginBottom="9px";
    const name=el("span","mono",path);name.style.flex="1";name.style.overflowWrap="anywhere";
    row.append(name,btn("移除",()=>{if(confirmDelete("移除对 "+path+" 的共享授权？"))send({cmd:"moby",action:"remove_share",path})},"danger small"));shares.append(row);
  });
  const buttons=el("div","row");
  buttons.append(btn("选择共享目录…",()=>send({cmd:"moby",action:"choose_share"}),"primary"));
  buttons.append(btn("应用更改并重启 VM",()=>{
    if(confirmDelete("重启 Moby VM 以应用目录授权？运行中的容器会被中断。"))send({cmd:"moby",action:"apply_shares"})
  }));
  shares.append(buttons);root.append(shares)}
const pages={dashboard,containers,images,volumes,networks,compose,build,settings};
function render(){
  d("title").textContent=pageNames[s.page]||"Containers";
  ["containers","images","volumes","networks"].forEach(k=>d("count-"+k).textContent=s[k].length);
  d("status").textContent="Linux VM";
  d("dot").classList.toggle("on",s.online);
  d("vm-state").textContent=s.online?"Running":"Off";
  d("ver").hidden=!s.online;d("ver").textContent=s.version.Version?"Docker "+s.version.Version+" · "+(s.info.Architecture||"arm64"):"Standard Moby Engine";
  d("power").textContent=s.online?"Stop":"Start";
  d("vm-running").textContent=s.online?s.containers.filter(c=>c.State==="running").length:"—";
  d("vm-cpus").textContent=s.online?(s.info.NCPU||4):"—";
  const target=Number(s.memory.balloon_target_mib)||0,total=Number(s.info.MemTotal)||0;
  // VZ's Balloon target is a guest limit, NOT host RSS or memory "used".
  d("vm-mem").textContent=s.online?(target?fmtBytes(target*1048576):"—")+(total?" / "+fmtBytes(total):""):"—";
  d("vm-mem").title="Balloon 目标 / VM 内存上限；不代表 Mac 实际占用";
  d("vm-meter").style.width=total&&target?Math.min(100,Math.round(target*1048576/total*100))+"%":"0%";
  document.body.dataset.vm=s.online?"running":"stopped";
  // A finished Docker snapshot clears the temporary "正在启动 VM…" status.
  d("subtitle").textContent=s.online?"Docker Engine 已连接":(s.error?"VM 未连接":"正在连接 Docker Engine…");
  d("statusbar").textContent="Kiri Moby  ·  "+(s.version.Version?"Docker "+s.version.Version:"Linux VM")+
    "  ·  "+s.containers.filter(c=>c.State==="running").length+" of "+s.containers.length+" containers running"+
    "  ·  "+(s.online?"Linux VM running":"Linux VM offline")+
    "  ·  OrbStack/default Docker context unchanged";
  const tabs=d("filter-tabs");tabs.replaceChildren();
  tabs.hidden=s.page!=="containers";
  if(s.page==="containers"){
    const counts={all:s.containers.length,running:s.containers.filter(c=>containerState(c)==="running").length,
      stopped:s.containers.filter(c=>containerState(c)==="stopped").length,failed:s.containers.filter(c=>containerState(c)==="failed").length};
    [["all","All"],["running","Running"],["stopped","Stopped"],["failed","Failed"]].forEach(([key,name])=>{
       const b=el("button",key===containerFilter?"active":"",name+"  "+counts[key]);
       b.onclick=()=>{containerFilter=key;render()};tabs.append(b)
    });
  }
  const out=d("content");out.replaceChildren();
  if(!s.online&&s.page!=="settings"){const box=el("div","card");box.append(el("h2","","Moby VM 未连接"),el("p","",s.error||"启动标准 Docker Engine 后显示容器和镜像。"));box.append(btn("启动 VM",()=>send({cmd:"connect"}),"primary"));out.append(box);return}
  (pages[s.page]||containers)(out)
}
function switchTo(page){s.page=page;s.search="";d("search").value="";document.querySelectorAll("nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===page));render()}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>switchTo(b.dataset.page));
d("search").oninput=e=>{s.search=e.target.value;render()};
d("refresh").onclick=()=>send({cmd:"refresh"});
d("power").onclick=()=>{if(s.online&&!confirmDelete("停止 Moby VM？"))return;send({cmd:s.online?"stop":"connect"})};
d("modalClose").onclick=()=>d("overlay").style.display="none";
d("overlay").onclick=e=>{if(e.target===d("overlay"))d("overlay").style.display="none"};
window.kiri={on(e){if(!e||typeof e!=="object")return;
 if(e.type==="snapshot"){Object.assign(s,{online:!!e.online,containers:e.containers||[],images:e.images||[],volumes:e.volumes||[],networks:e.networks||[],shares:e.shares||[],info:e.info||{},version:e.version||{},memory:e.memory||{},error:e.error});render()}
 else if(e.type==="operation"){if(e.ok&&["inspect","logs","exec","compose_logs","compose_ps","compose_up","compose_down","build"].includes(e.label)){d("modalTitle").textContent=e.label;d("modalText").textContent=e.message||"完成";d("overlay").style.display="flex"}else toast(e.label+": "+(e.message||"完成"),!e.ok)}
 else if(e.type==="vm"){d("subtitle").textContent=e.state==="starting"?"正在启动 VM…":e.state==="stopping"?"正在停止 VM…":"标准 Docker Engine"}
 else if(e.type==="selected_compose"){composePath=e.path||"";if(s.page==="compose")render()}
 else if(e.type==="detail")switchTo("containers");
}};
// Original upstream Kiri icon layout (without its legacy daemon or K8s runtime).
const phPaths={
 sidebar:'M3 5h18v14H3z M9 5v14',caret:'M9 6l6 6-6 6',
 cube:'M12 2l9 5v10l-9 5-9-5V7z M3 7l9 5 9-5 M12 12v10',
 stack:'M12 2l9 5-9 5-9-5z M3 12l9 5 9-5 M3 17l9 5 9-5',
 database:'M3 5c0-4 18-4 18 0s-18 4-18 0z M3 5v14c0 4 18 4 18 0V5 M3 12c0 4 18 4 18 0',
 network:'M6 4v6 M18 4v6 M12 14v6 M6 10h12 M12 10v4 M3 2h6v4H3z M15 2h6v4h-6z M9 18h6v4H9z',
 hammer:'M14 4l6 6 M18 2l4 4-7 7-4-4 M11 9L3 17v4h4l8-8',
 gear:'M12 3l2 2 3-.5 1 3 3 2-1 3 1 3-3 2-1 3-3-.5-2 2-2-2-3 .5-1-3-3-2 1-3-1-3 3-2 1-3 3 .5z M12 9a3 3 0 1 0 0 6a3 3 0 0 0 0-6',
 globe:'M12 2a10 10 0 1 0 0 20a10 10 0 0 0 0-20 M2 12h20 M12 2c-6 6-6 14 0 20 M12 2c6 6 6 14 0 20'
};
document.querySelectorAll("svg[data-ph]").forEach(svg=>{
 const path=phPaths[svg.dataset.ph];if(!path)return;
 svg.setAttribute("viewBox","0 0 24 24");
 svg.setAttribute("fill","none");svg.setAttribute("stroke","currentColor");svg.setAttribute("stroke-width","1.8");
 svg.setAttribute("stroke-linejoin","round");svg.setAttribute("stroke-linecap","round");
 svg.innerHTML='<path d="'+path+'"/>';
});
d("strip-settings").onclick=()=>switchTo("settings");
d("theme-toggle").onclick=()=>{
 const light=document.documentElement.dataset.mobyTheme!=="light";
 document.documentElement.dataset.mobyTheme=light?"light":"dark";
 document.documentElement.style.colorScheme=light?"light":"dark";
};
d("rail-toggle").onclick=()=>{
 document.body.classList.toggle("rail");d("rail-toggle").setAttribute("aria-pressed",String(!document.body.classList.contains("rail")));
};
document.querySelectorAll("nav button[data-page]").forEach(b=>b.classList.toggle("active",b.dataset.page===s.page));
render();send({cmd:"connect"});
